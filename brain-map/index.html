    document.getElementById("insp").innerHTML = "SOURCE " + t.id + "<br>GROUP " + t.group + "<br>r_H " + t.r.toFixed(6) +
      "<br>GATE r_H " + t.r.toFixed(6) + (t.d==="a" ? " &lt; " : " &gt; ") + "ε_H 0.15 → " + (t.d==="a" ? "ADMIT" : "REFUSE") +
      "<br>S_H " + t.sH + " · S_solv " + t.sSolv + " · R_H " + t.rHbit + "<br>CAUSE " + t.cause + "<br>AUDIT " + t.audit; }
  else if(sel.type==="bundle"){ const g = sel.g, mem = MODEL.threads.filter(t=>t.group===g);
    const a = mem.filter(t=>t.d==="a").length;
    document.getElementById("insp").innerHTML = "ORIGIN " + g + "<br>COUNT " + mem.length + " · ADMIT " + a + " · REFUSE " + (mem.length-a) +
      "<br>HUE " + MODEL.ghue[g] + "<br>MEMBERS " + mem.map(t=>t.id).join(" "); }
  else if(sel.type==="dest"){ const d = sel.d, mem = MODEL.threads.filter(t=>t.d===d);
    document.getElementById("insp").innerHTML = (d==="a" ? "ORGANIZED" : "ASIDE") + " · " + mem.length +
      "<br>MEMBERS " + mem.map(t=>t.id).join(" "); }
  const gd = document.getElementById("groups");
  gd.innerHTML = MODEL.groups.map(g=>{
    const c = MODEL.counts[g];
    return "<div style='white-space:nowrap'><span class='tag' data-g='"+g+"'>"+g+" "+c+"</span></div>";
  }).join("");
  gd.querySelectorAll(".tag").forEach(el=>el.onclick=()=>{ sel={type:"bundle", g:el.dataset.g}; draw(); });
  document.getElementById("scrub").value = T;
}
function buildLabels(){
  const L = document.getElementById("labels"); L.innerHTML = "";
  const mk = (fx, fy, html, cls)=>{
    const d = document.createElement("div"); d.className = "ov"+(cls?" "+cls:"");
    d.style.left = (fx*100)+"%"; d.style.top = (fy*100)+"%"; d.innerHTML = html; L.appendChild(d); return d; };
  const LROW = {"QUIET":[0.062,0.090], "KEEPERS":[0.118,0.146], "MIXED":[0.062,0.090], "BEST-12OF12":[0.118,0.146], "TWIN-LADDER":[0.062,0.090]};
  for(const g of MODEL.groups){
    const el = mk(MODEL.originX[g], LROW[g][0], g, "tag olab");
    el.dataset.g = g;
    el.onclick = ()=>{ sel={type:"bundle", g:g}; draw(); };
    const ec = mk(MODEL.originX[g], LROW[g][1], "· "+MODEL.counts[g], "tag olab");
    ec.dataset.g = g;
    ec.onclick = ()=>{ sel={type:"bundle", g:g}; draw(); };
  }
  mk(0.5, 0.285, "THE GATE · ε_H 0.15");
  mk(MODEL.epsTickX, 0.365, "ε_H");
  const oL = mk(0.31, 0.565, "ORGANIZED · 49", "tag"); oL.onclick = ()=>{ sel={type:"dest", d:"a"}; draw(); };
  const oR = mk(0.69, 0.565, "ASIDE · 25", "tag"); oR.onclick = ()=>{ sel={type:"dest", d:"r"}; draw(); };
}
function sizeStage(){
  SW = stageEl.clientWidth; SH = Math.round(SW*5/3);
  stageEl.style.height = SH+"px"; cv.width = SW; cv.height = SH;
  const f = (r)=>Math.max(13, Math.round(r*SH));
  document.getElementById("hudT").style.fontSize = f(0.020)+"px";
  document.getElementById("hudS").style.fontSize = f(0.020)+"px";
  document.querySelectorAll(".ov").forEach(el=>el.style.fontSize = f(0.020)+"px");
  document.querySelectorAll(".pan").forEach(el=>el.style.fontSize = f(0.020)+"px");
  document.querySelectorAll(".pan h3").forEach(el=>el.style.fontSize = f(0.022)+"px");
  document.getElementById("transport").style.fontSize = f(0.020)+"px";
  document.querySelectorAll("#transport button").forEach(el=>el.style.fontSize = f(0.020)+"px");
}
cv.addEventListener("click", (e)=>{
  const r = cv.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top;
  for(const g of MODEL.groups){
    if(Math.hypot(X(MODEL.originX[g])-x, Y(MODEL.originY)-y)<=16){ sel={type:"bundle", g:g}; draw(); return; } }
  let best = null, bd = 1e9;
  for(const t of MODEL.threads){ const pts = threadPts(t);
    for(const p of pts){ const d = Math.hypot(p[0]-x, p[1]-y); if(d<bd){ bd=d; best=t; } } }
  if(best && bd<=10){ sel={type:"thread", k:best.k}; draw(); return; }
  for(const t of MODEL.threads){
    if(Math.hypot(X(t.dx)-x, Y(t.dy)-y)<=10){ sel={type:"thread", k:t.k}; draw(); return; } }
  const dl = Math.hypot(X(0.31)-x, Y(0.50)-y), dr = Math.hypot(X(0.69)-x, Y(0.50)-y);
  if(Math.min(dl,dr)<=60){ sel={type:"dest", d: dl<dr ? "a" : "r"}; draw(); return; }
});
document.getElementById("bPlay").onclick = ()=>{
  if(playing){ playing=false; document.getElementById("bPlay").textContent="PLAY"; return; }
  playing=true; document.getElementById("bPlay").textContent="PAUSE";
  const start = performance.now()-T;
  const step = (now)=>{ if(!playing) return; T = (now-start)%CYCLE; draw(); requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
document.getElementById("bSettled").onclick = ()=>{ playing=false; document.getElementById("bPlay").textContent="PLAY"; T=3000; draw(); };
document.getElementById("bStep").onclick = ()=>{ playing=false; document.getElementById("bPlay").textContent="PLAY"; T=Math.min(CYCLE, T+15); draw(); };
document.getElementById("scrub").oninput = (e)=>{ playing=false; document.getElementById("bPlay").textContent="PLAY"; T=parseFloat(e.target.value); draw(); };
document.getElementById("bReset").onclick = ()=>{ cam={cx:0.5, cy:0.5, zoom:1}; draw(); };
document.getElementById("bZoomSel").onclick = ()=>{
  let g = null;
  if(sel && sel.type==="bundle") g = sel.g;
  else if(sel && sel.type==="thread") g = MODEL.threads[sel.k].group;
  if(g && MODEL.originX[g]!==undefined){ cam={cx:MODEL.originX[g], cy:0.32, zoom:2.0}; draw(); } };
window.__MAP__ = { model: MODEL,
  phaseAt: phaseAt, landedAt: landedAt, ledgerAt: ledgerAt,
  threadPoint: (k, s)=>{ const pts = threadPts(MODEL.threads[k]); return pts[Math.min(pts.length-1, s)]; },
  originXY: (g)=>[X(MODEL.originX[g]), Y(MODEL.originY)],
  destXY: (d)=>[X(d==="a"?0.31:0.69), Y(0.50)],
  stage: ()=>({SW: SW, SH: SH}),
  setT: (t)=>{ T=t; draw(); }, getT: ()=>T, getSel: ()=>sel };
sizeStage(); buildLabels(); draw();
window.addEventListener("resize", ()=>{ sizeStage(); buildLabels(); draw(); });
</script></body></html>
