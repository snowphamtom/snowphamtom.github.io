        let pts = paths[ti].map(p=>proj(p));
        if (k === 1){ const sp = [];
          for (let u=0; u<=8; u++){ const w = u/8, a = pts[0], c = pts[1], b = pts[2];
            sp.push([(1-w)*(1-w)*a[0] + 2*(1-w)*w*c[0] + w*w*b[0],
                     (1-w)*(1-w)*a[1] + 2*(1-w)*w*c[1] + w*w*b[1]]); }
          pts = sp; }
        for (let sIdx=0; sIdx<pts.length-1; sIdx++){
          const d = segDist(x, y, pts[sIdx][0], pts[sIdx][1], pts[sIdx+1][0], pts[sIdx+1][1]);
          if (d < tbd){ tbd = d; best = threadTarget(k, ti); }
        }
      }
    }
  }
  if (!best){ bd = 20;
    reg.forEach((m,j)=>{ const [px,py] = proj(MEM_ANAT[j]); const d = Math.hypot(px-x, py-y);
      if (d < bd){ bd = d; best = { type:"mem", i: j }; } });
  }
  if (!best){ bd = 12;
    for (let k=0;k<7;k++){ if (!strOn[k]) continue;
      const sp = bundleSpine(k).map(p=>proj(p));
      for (let sIdx=0; sIdx<sp.length-1; sIdx++){
        const d = segDist(x, y, sp[sIdx][0], sp[sIdx][1], sp[sIdx+1][0], sp[sIdx+1][1]);
        if (d < bd){ bd = d; best = { type:"str", i: k }; }
      }
    }
  }
  sel = best;
}
/* tapping the open inspector dismisses it */
document.getElementById("pSel").addEventListener("click", e=>{
  if (e.currentTarget.classList.contains("overlay")) sel = null;
});
/* ---------------- verification surface ---------------- */
window.__brain = {
  DATA, litAt, phaseAt, settledCounts, firedMem, vt,
  projCore: i => proj(corePos(i, vt())),
  projMem: j => proj(MEM_ANAT[j]),
  projCube: p => proj(p),
  bundleThreads, bundleSpine, threadTarget, meshEdges: ()=>MESH_EDGES.slice(), shellRing,
  insetSize: ()=>({ w: IW, h: IH }),
  view: ()=>({ ...view }), canvas: ()=>({ w: cv.width, h: cv.height, sw: SW, sh: SH }),
  setView: v => { view = { ...v }; },
  regionOfCore: i => regionOf(VERDICT_POS[i]), regionOfMem: j => regionOf(MEM_ANAT[j]),
  stringLit, corePos, TL, stageOf, procRecord, refusalLedger, journeyPos,
  restPos: i => REST_POS[i], verdictPos: i => VERDICT_POS[i]
};
layout();
if (T_OVR === null) playBtn.textContent = "PAUSE"; else playBtn.textContent = "PLAY";
frame();
</script>
