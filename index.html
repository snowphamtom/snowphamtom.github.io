<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monsters Ink</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04070f">
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;color:#cfe8ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(120% 70% at 50% -10%, #0d2247 0%, #060f22 46%, #030814 78%, #01030a 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);}
  a.door{display:block;text-decoration:none;text-align:center;width:min(92vw,430px);padding:12px 0 6px;}
  a.door:active{transform:translateY(1px);}
  .emblem{width:148px;margin:0 auto;}
  .mouth{width:min(78vw,330px);margin:26px auto 0;}
  .line{margin-top:30px;font-size:15px;color:#8fb6dd;letter-spacing:.14em;}
  .legal{margin:20px auto 0;max-width:38ch;font-size:9.5px;line-height:1.8;letter-spacing:.18em;color:#46688f;}
</style>
</head>
<body>
  <a class="door" href="/enter/" aria-label="Enter">
    <div class="emblem">
      <svg viewBox="0 0 200 160" aria-hidden="true" style="display:block;width:100%;height:auto;">
        <path d="M100 6 C150 6 188 52 188 108 L188 154 L12 154 L12 108 C12 52 50 6 100 6 Z" fill="#dceffb"/>
        <path d="M100 22 C142 22 172 60 172 108 L172 154 L28 154 L28 108 C28 60 58 22 100 22 Z" fill="#9cc4e8"/>
        <path d="M100 34 C136 34 162 66 162 108 L162 154 L38 154 L38 108 C38 66 64 34 100 34 Z" fill="#123a6e"/>
        <path d="M100 44 C131 44 153 72 153 108 L153 154 L47 154 L47 108 C47 72 69 44 100 44 Z" fill="none" stroke="#e8b34b" stroke-width="3"/>
        <path d="M100 50 C128 50 147 75 147 108 L147 154 L53 154 L53 108 C53 75 72 50 100 50 Z" fill="#050f22"/>
        <g stroke="#9fd0ff" stroke-width="1" fill="#cfe8ff" opacity="0.9">
          <circle cx="78" cy="86" r="2"/><circle cx="88" cy="102" r="2"/><circle cx="72" cy="116" r="2"/><circle cx="90" cy="128" r="2"/>
          <path d="M78 86 L88 102 L72 116 M88 102 L90 128" fill="none"/>
          <circle cx="124" cy="82" r="2"/><circle cx="114" cy="100" r="2"/><circle cx="130" cy="114" r="2"/><circle cx="116" cy="130" r="2"/>
          <path d="M124 82 L114 100 L130 114 M114 100 L116 130" fill="none"/>
        </g>
      </svg>
    </div>
    <div class="mouth">
      <svg viewBox="0 0 200 130" aria-hidden="true" style="display:block;width:100%;height:auto;">
        <path d="M100 8 C146 8 178 44 178 92 L178 122 L22 122 L22 92 C22 44 54 8 100 8 Z" fill="#01040a" stroke="#33507a" stroke-width="2"/>
        <path d="M100 8 L100 122" stroke="#e8b34b" stroke-width="1.5" opacity="0.55"/>
      </svg>
    </div>
    <div class="line">Speak, and be known.</div>
    <div class="legal">PRIVATE — CONFIDENTIAL · ACCESS BY INVITATION ONLY · EVERYTHING BEYOND THIS DOOR IS THE CONFIDENTIAL PROPERTY OF MONSTERS INK LLC AND IS SUBJECT TO NON-DISCLOSURE</div>
  </a>
</body>
</html>
