<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>THE MEASURED HOUSE — a graphing series</title>
<meta name="description" content="Six graph plates and a judge slate, drawn from measured records only, on the staggered-ignition rotational weave. Nothing random."/>
<style>
  /* ONE STYLE · ONE FORMAT (Taylor's law, 2026-10-23 23:09 CT): every plate sits on the

     sizes are set by the script from TYPE, as fractions of stage height — one scale). */
  :root{ --gold:#c9a227; --ink:#e8e6f8; --mut:#8595b8; --line:#1d2a47;

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000000;color:var(--ink);overflow:hidden;

    gap:8px;pointer-events:none}
  #hud .ttl{font-size:var(--t-hud);letter-spacing:.12em;color:#f2c14e;border:1px solid rgba(201,162,39,.55);
    padding:5px 10px;background:rgba(4,8,16,.72)}
  #hud .fr{font-size:var(--t-hud);color:var(--mut);border:1px solid var(--line);padding:5px 10px;

  #hud .fr b{color:var(--ink)}
  #nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:11;
    display:flex;gap:8px;align-items:center}
  #nav .dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(4,8,16,.8);
    color:var(--mut);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #nav .dot.on{border-color:var(--gold);color:#f2c14e}
  #nav button.snd{border:1px solid var(--line);background:rgba(4,8,16,.8);color:var(--mut);border-radius:999px;
    padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit}
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none}
  .lab{position:absolute;transform:translate(-50%,-50%);font-size:var(--t-lab);letter-spacing:.06em;color:var(--ink);
    border:1px solid rgba(232,230,248,.35);background:rgba(4,8,16,.66);padding:2px 7px;white-space:nowrap}

  .lab.pink{border-color:rgba(244,114,182,.55);color:#ffb1d6}
  .lab.dim{color:var(--mut);border-color:rgba(29,42,71,.9)}
  .lab.sm{font-size:var(--t-lab-sm);padding:1px 5px}
  .plateTitle{position:absolute;transform:translateX(-50%);text-align:center}
  .plateTitle .k{font-size:var(--t-kick);color:var(--mut);letter-spacing:.22em}
  .plateTitle .n{font-size:var(--t-name);letter-spacing:.14em;color:#f2c14e;margin-top:3px}

    padding:10px 14px;font-size:var(--t-slate);line-height:1.7;opacity:0;pointer-events:none}
  #slate .h{color:#57c8ff;letter-spacing:.1em}
  #slate .g{color:#f2c14e}
  #slate .p{color:#ffb1d6}
  #slate .d{color:var(--mut)}
  #bigSlate{position:fixed;inset:0;z-index:8;display:none;pointer-events:none}
  #bigSlate .box{position:absolute;border:1px solid rgba(201,162,39,.65);background:rgba(5,9,18,.94);
    padding:14px 18px;font-size:var(--t-big);line-height:1.7}
  #bigSlate .h{color:#f2c14e;letter-spacing:.16em;font-size:var(--t-big)}
  #bigSlate .bl{color:#57c8ff}
  #bigSlate .d{color:var(--mut)}
  #stepBox{position:fixed;z-index:10;display:none;font-size:var(--t-hud);color:var(--mut);
    border:1px solid rgba(201,162,39,.55);padding:5px 10px;background:rgba(4,8,16,.72);text-align:right}
  #stepBox b{color:#f2c14e}
  #countBox{position:fixed;z-index:10;display:none;font-size:var(--t-hud);color:var(--mut);
    border:1px solid var(--line);padding:5px 10px;background:rgba(4,8,16,.72);text-align:left}
  #countBox b{color:var(--ink)}
  /* ---------- the 4D transport + inspector (page chrome, same kit) ---------- */
  #transport{position:fixed;left:50%;transform:translateX(-50%);bottom:46px;z-index:12;
    display:flex;flex-direction:column;gap:4px;width:min(96vw,430px)}
  #transport .row{display:flex;gap:6px;align-items:center;justify-content:center}
  .tbtn{border:1px solid var(--line);background:rgba(4,8,16,.85);color:var(--ink);
    font-family:inherit;font-size:12px;min-height:32px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .tbtn.gold{border-color:rgba(201,162,39,.55);color:#f2c14e}
  #scrub{flex:1;accent-color:#c9a227;height:32px;min-width:60px;cursor:pointer}
  #tRead{font-size:10px;color:var(--mut);white-space:nowrap;letter-spacing:.04em}
  .chip{border:1px solid var(--line);background:rgba(4,8,16,.85);cursor:pointer;
    min-height:24px;padding:2px 7px;font-family:inherit;font-size:10px;color:var(--ink);
    display:flex;align-items:center;gap:5px}

  .chip.off{opacity:.32}
  #inspector{position:fixed;z-index:12;display:none;border:1px solid rgba(201,162,39,.65);
    background:rgba(5,9,18,.94);padding:8px 12px;font-size:11px;line-height:1.6;color:var(--ink)}

</head>

                                 // light direction from the mark's base; dot marks: offset dot·SH, alpha aDot
const SHADE = { floor:0.42, tintK:0.35, tintThresh:0.75, steps:16 };  // colour shading (see shadeCol)

function hexRGB(hex){ return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)]; }
/* THE LIGHT FORMULAS — every mark's brightness in the series, from the one source.
   Nothing is added to a mark: no additive pass exists anywhere in this file.
   d(p)    = distance from p to the source, in stage heights
   illum(p)= LIGHT.i / (1 + LIGHT.fall · d²)          (inverse falloff)
   shade   = shadeCol: the hue shaded by illum — toward black low, toward the
             light's colour high (SHADE, below) — the only colour a mark takes
   rim     = the source-facing edges of a mark, alpha 0.85 · illum, length RIM_FRAC
   firing  = an event raises the mark's illumination to I_eff = 1 inside shadeCol's
             own formula (shadeFire) — the hue turns pale toward the light colour
             against its saturated neighbours; the mark's geometry never changes
   vignette= radial gradient centred on the source, 0 → 0.40 black at 1.05 stage
             heights (falloff — the stage darkens away from the source) */
function illum(px,py){ const d=Math.hypot(px-LX,py-LY)/SH; return LIGHT.i/(1+LIGHT.fall*d*d); }
function headR(px,py){ return SH*0.0038*(0.7+0.6*illum(px,py)); }

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const ease=x=>{ x=clamp(x,0,1); return 1-Math.pow(1-x,3); };
const ramp=(lt,g)=>ease(lt-g);              /* ignition ramp of group g at local frame lt */

/* ---------- audio: pattern k sounds harmonic k (110 Hz × k). Tones encode ignitions only. */
let actx=null, soundOn=false, lastF=-1, lastSlot=-1;
function tone(f,t0,dur,peak){ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain();
  o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak,t0+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.05); }
function clockAudio(F,slot){ if(!soundOn||!actx||T_OVR!==null) return;
  if(F!==lastF){ lastF=F; try{ tone(110*((F%7)+1), actx.currentTime+0.02, 2.4, 0.05); }catch(e){} }
  if(slot!==lastSlot){ lastSlot=slot; try{ const t0=actx.currentTime+0.05;
    tone(110*((slot%7)+1),t0,3.2,0.035); tone(110*((slot%7)+1)*2,t0,3.2,0.02); }catch(e){} } }

/* ---------- drawing helpers */
function stream(x0,y0,x1,y1,bend,color,alpha,width){
  const mx=(x0+x1)/2, my=(y0+y1)/2, dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1;
  const cx=mx+(-dy/L)*bend, cy=my+(dx/L)*bend;
  ctx.strokeStyle=color; ctx.globalAlpha=alpha*0.16; ctx.lineWidth=width*3.2;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(cx,cy,x1,y1); ctx.stroke();
  ctx.globalAlpha=alpha; ctx.lineWidth=width;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(cx,cy,x1,y1); ctx.stroke();
  ctx.globalAlpha=1;
  return [cx,cy];
}
function qpoint(x0,y0,cx,cy,x1,y1,u){ const v=1-u;
  return [v*v*x0+2*v*u*cx+u*u*x1, v*v*y0+2*v*u*cy+u*u*y1]; }
function dot(x,y,r,color,alpha){ ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283185307); ctx.fill(); ctx.globalAlpha=1; }

/* a bar's rim: the two edges facing the one light source — the top edge, lit from the
   source side across RIM_FRAC of its width, and the source-side edge down from the top */
function rimBar(x,y,w,h,cx){
  const il=illum(cx,y); if(h<1.5||il<=0) return;
  ctx.globalAlpha=0.85*il; ctx.strokeStyle=LIGHT.color; ctx.lineWidth=1.2;
  const dir = LX>=cx ? 1 : -1, xe = dir>0 ? x+w : x;
  ctx.beginPath(); ctx.moveTo(xe,y); ctx.lineTo(xe-dir*w*RIM_FRAC,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xe,y); ctx.lineTo(xe,y+Math.min(h*0.5,SH*0.028)); ctx.stroke();
  ctx.globalAlpha=1; }
/* SHADES OF COLOR — no flat fills. A mark's colour is its weave hue shaded by the
   illumination at its own position: out = base·dark·(1−tint) + light·tint per channel,
   dark = SHADE.floor + (1−SHADE.floor)·I  (toward black at low illumination),
   tint = SHADE.tintK · max(0, I−SHADE.tintThresh)/(1−SHADE.tintThresh)  (toward the
   light's colour at high illumination). I is quantized to SHADE.steps for fill reuse. */
const _shadeCache={};
function shadeI(hex,I){
  I=Math.round(I*SHADE.steps)/SHADE.steps; const key=hex+"|"+I;
  if(_shadeCache[key]) return _shadeCache[key];
  const c=hexRGB(hex), L=hexRGB(LIGHT.color);
  const dark=SHADE.floor+(1-SHADE.floor)*I,
        tint=SHADE.tintK*Math.max(0,I-SHADE.tintThresh)/(1-SHADE.tintThresh);
  const out=`rgb(${Math.round(c[0]*dark*(1-tint)+L[0]*tint)},${Math.round(c[1]*dark*(1-tint)+L[1]*tint)},${Math.round(c[2]*dark*(1-tint)+L[2]*tint)})`;
  _shadeCache[key]=out; return out; }
function shadeCol(hex,px,py){ return shadeI(hex, illum(px,py)); }
/* a firing mark's shade: the SHADE formula fed I_eff = 1 — the event raises the
   illumination the formula sees, exactly as the brain's firing method does. */
function shadeFire(hex){ return shadeI(hex, 1); }
/* SHADOWS — a bar is a post on the baseline. Its shadow is the parallelogram cast
   from its base along the light direction v = normalize(base − L)·(height·SHADOW.k),
   fading from SHADOW.a to nothing at the tip. No fixed offsets: direction and
   length are computed from the mark's position, its height, and the one source. */
function castShadow(cx,base,w,h){
  if(h<1.5) return;
  const dx=cx-LX, dy=base-LY, m=Math.hypot(dx,dy)||1, vx=dx/m*h*SHADOW.k, vy=dy/m*h*SHADOW.k;
  const g=ctx.createLinearGradient(cx,base,cx+vx,base+vy);
  g.addColorStop(0,`rgba(0,0,0,${SHADOW.a})`); g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g; ctx.beginPath();
  ctx.moveTo(cx-w/2,base); ctx.lineTo(cx+w/2,base);
  ctx.lineTo(cx+w/2+vx,base+vy); ctx.lineTo(cx-w/2+vx,base+vy);
  ctx.closePath(); ctx.fill(); }
/* a dot mark's shadow: the same light direction, offset SHADOW.dot·SH, alpha SHADOW.aDot */
function shadowDot(px,py){
  const dx=px-LX, dy=py-LY, m=Math.hypot(dx,dy)||1, d=SHADOW.dot*SH;
  dot(px+dx/m*d, py+dy/m*d, SH*0.0032, "#000000", SHADOW.aDot); }
/* REFLECTIONS — a bar mirrored across its baseline: height × REFL.att, drawn in the
   bar's shaded colour at alpha REFL.alpha · illum(reflected centre). Mirror geometry,
   computed — not a cosmetic flipped copy. */
function reflectBar(x,base,w,h,hex,cx){
  if(h<1.5) return; const rh=h*REFL.att, my=base+rh/2;
  ctx.globalAlpha=REFL.alpha*illum(cx,my); ctx.fillStyle=shadeCol(hex,cx,my);
  ctx.fillRect(x,base,w,rh); ctx.globalAlpha=1; }
/* the shared dashboard: one component, four mono panels, exact figures only.

/* the pipeline's one layout transform: seat coordinates fitted uniformly (aspect kept)

function seatMap(){
  const S=DATA.pipeline.seats;
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(const s of S){ mnx=Math.min(mnx,s.x); mxx=Math.max(mxx,s.x); mny=Math.min(mny,s.y); mxy=Math.max(mxy,s.y); }
  const fx0=X(FMT.plotX0), fx1=X(FMT.plotX1), fy0=Y(FMT.plotTop), fy1=Y(FMT.plotBase);
  const sc=Math.min((fx1-fx0)/((mxx-mnx)*SW), (fy1-fy0)/((mxy-mny)*SH));
  const bcx=SX+(mnx+mxx)/2*SW, bcy=SY+(mny+mxy)/2*SH, fcx=(fx0+fx1)/2, fcy=(fy0+fy1)/2;
  const m=(fx,fy)=>[fcx+(X(fx)-bcx)*sc, fcy+(Y(fy)-bcy)*sc];
  return { seat:S.map(s=>m(s.x,s.y)), lab:S.map(s=>m(s.lx,s.ly)) };

/* ================= PLATE 1 · THE GATE — residual skyline, chain order.
   Every bar is a neuron of the gate: a head dot sits at its head, shaded from
   the one light, and the gold audit chain across the tops is the web that
   joins them. Light from the one source. */
const MAXV_G = 0.26;
function drawGate(t,lt){
  const vs=DATA.gate, x0=X(FMT.plotX0), x1=X(FMT.plotX1), base=Y(FMT.plotBase), top=Y(FMT.plotTop);
  const cw=(x1-x0)/vs.length, plotH=base-top, yOf=v=>base-(v/MAXV_G)*plotH;
  ctx.font=TP.grid+"px ui-monospace,Menlo,monospace"; ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let gv=0.05; gv<MAXV_G; gv+=0.05){ const y=yOf(gv);
    ctx.strokeStyle=GRID; ctx.globalAlpha=.5; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=MUT; ctx.fillText(gv.toFixed(2), x0-3, y); }
  const ey=yOf(EPS); ctx.strokeStyle=GOLD; ctx.globalAlpha=.9; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(x0,ey); ctx.lineTo(x1,ey); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
  const tops=[], geom=[];
  vs.forEach((v,j)=>{ const g=Math.min(6,Math.floor(j*7/vs.length)), r=ramp(lt,g);
    const h=(v.r_H/MAXV_G)*plotH*r, x=x0+j*cw+cw*0.18, wdt=cw*0.64;
    geom.push({x, w:wdt, h, cx:x+wdt/2, col:v.decision==="admit"?TEAL:PINK}); tops.push([x+wdt/2, base-h]); });
  /* the floor pass — reflections and shadows on the baseline band, from the one light */
  ctx.save(); ctx.beginPath(); ctx.rect(SX, base, SW, Y(FMT.dashTop)-base); ctx.clip();
  for(const b of geom){ reflectBar(b.x, base, b.w, b.h, b.col, b.cx); castShadow(b.cx, base, b.w, b.h); }
  ctx.restore();
  for(const b of geom){ const y=base-b.h, sc=shadeCol(b.col,b.cx,y);
    ctx.globalAlpha=.92; ctx.fillStyle=sc;
    ctx.fillRect(b.x, y, b.w, b.h); ctx.globalAlpha=1;
    if(b.h>1.5){ rimBar(b.x, y, b.w, b.h, b.cx); dot(b.cx, y, headR(b.cx,y), sc, illum(b.cx,y)); } }
  /* the audit chain — the web across the tops, shaded segment by segment from the light */
  ctx.lineWidth=1.4;
  for(let i=0;i<tops.length-1;i++){ const mx=(tops[i][0]+tops[i+1][0])/2, my=(tops[i][1]+tops[i+1][1])/2;
    ctx.globalAlpha=.5; ctx.strokeStyle=shadeCol(GOLD,mx,my);
    ctx.beginPath(); ctx.moveTo(tops[i][0],tops[i][1]); ctx.lineTo(tops[i+1][0],tops[i+1][1]); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.strokeStyle=BASEL; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0,base); ctx.lineTo(x1,base); ctx.stroke();
}

/* ================= PLATE 2 · THE PIPELINE — the base, formalized */
function drawPipeline(t,lt){
  const seats=DATA.pipeline.seats, M=seatMap(), S=M.seat, FL=2*Y(FMT.plotBase); // mirror line = 2·baseline
  const edgeC=e=>e.pink?PINK:GOLD;
  /* the floor reflection — the whole diagram mirrored across the field's baseline */
  ctx.save(); ctx.beginPath(); ctx.rect(SX, FL/2, SW, Y(FMT.dashTop)-FL/2); ctx.clip();
  for(const e of DATA.pipeline.edges){ const r=Math.min(ramp(lt,seats[e.a].g), ramp(lt,seats[e.b].g));
    if(r<=0) continue;
    const mx=(S[e.a][0]+S[e.b][0])/2, my=(S[e.a][1]+S[e.b][1])/2;
    const c=stream(S[e.a][0],FL-S[e.a][1],S[e.b][0],FL-S[e.b][1], -e.bend, edgeC(e),
                   .5*r*REFL.alpha*(0.35+0.65*illum(mx,FL-my)), 1.3);
    for(let i=0;i<e.n;i++){ const u=((i/e.n)+t*0.011+e.ph)%1;
      const p=qpoint(S[e.a][0],FL-S[e.a][1],c[0],c[1],S[e.b][0],FL-S[e.b][1],u);
      dot(p[0],p[1],1.6, shadeCol(edgeC(e),p[0],p[1]), .95*r*REFL.alpha*illum(p[0],p[1])); } }
  S.forEach((p,j)=>{ const r=ramp(lt,seats[j].g); if(r<=0) return;
    dot(p[0],FL-p[1], (seats[j].king?4:2.6), shadeCol(seats[j].king?GOLD:BLUE,p[0],FL-p[1]), r*REFL.alpha*illum(p[0],FL-p[1])); });
  ctx.restore();
  for(const e of DATA.pipeline.edges){ const ra=ramp(lt,seats[e.a].g), rb=ramp(lt,seats[e.b].g), r=Math.min(ra,rb);
    if(r<=0) continue;
    const mx=(S[e.a][0]+S[e.b][0])/2, my=(S[e.a][1]+S[e.b][1])/2;
    const c=stream(S[e.a][0],S[e.a][1],S[e.b][0],S[e.b][1], e.bend, edgeC(e),
                   .5*r*(0.35+0.65*illum(mx,my)), 1.3);
    for(let i=0;i<e.n;i++){ const u=((i/e.n)+t*0.011+e.ph)%1;
      const p=qpoint(S[e.a][0],S[e.a][1],c[0],c[1],S[e.b][0],S[e.b][1],u);
      dot(p[0],p[1],1.6, shadeCol(edgeC(e),p[0],p[1]), .95*r*illum(p[0],p[1])); } }
  S.forEach((p,j)=>{ const r=ramp(lt,seats[j].g); if(r<=0) return;
    shadowDot(p[0],p[1]);
    dot(p[0],p[1], (seats[j].king?4:2.6)*(0.7+0.6*illum(p[0],p[1])),
            shadeCol(seats[j].king?GOLD:BLUE,p[0],p[1]), r*illum(p[0],p[1])); });
}

/* ================= PLATE 3 · THE REGISTER — cumulative rows by hour */
function drawRegister(t,lt){
  const pts=DATA.register.points, x0=X(FMT.plotX0), x1=X(FMT.plotX1), base=Y(FMT.plotBase), top=Y(FMT.plotTop);
  const maxC=pts[pts.length-1][1];
  const P=pts.map((p,i)=>[x0+(x1-x0)*(i/(pts.length-1)), base-(p[1]/maxC)*(base-top)]);
  const upto=Math.max(2, Math.ceil(P.length*ease(lt/6)));
  const stair=(ctx2,dy)=>{ ctx2.beginPath(); ctx2.moveTo(P[0][0],P[0][1]+dy);
    for(let i=1;i<upto;i++){ ctx2.lineTo(P[i][0],P[i-1][1]+dy); ctx2.lineTo(P[i][0],P[i][1]+dy); } };
  /* the staircase's shadow — its silhouette cast along the light direction from
     the field's centroid, and its reflection mirrored across the baseline */
  const cen=[(x0+x1)/2,(top+base)/2], cvx=cen[0]-LX, cvy=cen[1]-LY, cm=Math.hypot(cvx,cvy)||1,
        shx=cvx/cm*SH*0.010, shy=cvy/cm*SH*0.010;
  ctx.save(); ctx.beginPath(); ctx.rect(SX, base, SW, Y(FMT.dashTop)-base); ctx.clip();
  ctx.save(); ctx.translate(0,2*base); ctx.scale(1,-1);
  stair(ctx,0); ctx.strokeStyle=GOLD; ctx.globalAlpha=REFL.alpha*0.67; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
  ctx.restore();
  ctx.save(); ctx.translate(shx,shy); stair(ctx,0);
  ctx.strokeStyle="#000000"; ctx.globalAlpha=0.22; ctx.lineWidth=SH*0.010; ctx.stroke(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(P[0][0],base);
  for(let i=0;i<upto;i++){ if(i>0) ctx.lineTo(P[i][0],P[i-1][1]); ctx.lineTo(P[i][0],P[i][1]); }
  ctx.lineTo(P[upto-1][0],base); ctx.closePath();
  /* the staircase's area wash: one computed shade — the staircase's own colour
     shaded by the illumination at its centroid, flat at 0.12 — no gradient pass */
  ctx.globalAlpha=0.12; ctx.fillStyle=shadeCol(VIOLET,cen[0],cen[1]); ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=shadeCol(GOLD,cen[0],cen[1]); ctx.lineWidth=1.8; stair(ctx,0); ctx.stroke();
  for(let i=0;i<upto;i++) dot(P[i][0],P[i][1], headR(P[i][0],P[i][1])*1.1, shadeCol(GOLD,P[i][0],P[i][1]), illum(P[i][0],P[i][1]));
  if(lt>=6){ const L=P[P.length-1];
    ctx.globalAlpha=.5; ctx.strokeStyle=GOLD; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(L[0],L[1],SH*0.011,0,6.2832); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.strokeStyle=BASEL; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0,base); ctx.lineTo(x1,base); ctx.stroke();
}

/* ================= PLATE 4 · THE FRONTIER — phyllotaxis field, exact counts.
   Point positions are the data (θ_i = i × golden angle, r = c√i); their brightness
   on the stage comes from the one light's vignette falloff pass, like every plate. */
let fOff=null, fDrawn=0, fKey=-1;
function drawFrontier(t,lt,key){
  const F=DATA.frontier, cx=X(FMT.heroCX), cy=Y(FMT.heroCY), ringR=FIELD_R, maxR=ringR/FMT.ringF,
        c=maxR/Math.sqrt(F.hits);
  if(!fOff||fOff.width!==cv.width||fOff.height!==cv.height){
    fOff=document.createElement("canvas"); fOff.width=cv.width; fOff.height=cv.height; fDrawn=0; fKey=-1; }
  if(fKey!==key){ const o=fOff.getContext("2d"); o.clearRect(0,0,fOff.width,fOff.height); fDrawn=0; fKey=key; }
  const target= lt>=6 ? F.hits : Math.floor(F.hits*ease(lt/6));
  if(target>fDrawn){ const o=fOff.getContext("2d"); o.setTransform(DPR,0,0,DPR,0,0); o.fillStyle=GOLD;
    o.beginPath();
    for(let i=fDrawn;i<target;i++){ const r=c*Math.sqrt(i), a=i*GA;
      o.rect(cx+Math.cos(a)*r-0.9, cy+Math.sin(a)*r-0.9, 1.8, 1.8); }
    o.fill(); fDrawn=target; }
  const yaw=(t/8)*(6.283185307/56);            /* the weave's rotation: one 1/56 turn per pattern-frame */
  /* the field disc's cast shadow — its silhouette offset along the light direction
     from the disc centre, in stage space (it does not rotate with the field) */
  const dvx=cx-LX, dvy=cy-LY, dm=Math.hypot(dvx,dvy)||1, doff=SH*0.012;
  ctx.globalAlpha=0.30; ctx.fillStyle="#000000";
  ctx.beginPath(); ctx.arc(cx+dvx/dm*doff, cy+dvy/dm*doff, maxR, 0, 6.2832); ctx.fill(); ctx.globalAlpha=1;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(yaw); ctx.drawImage(fOff,-cx,-cy,W,H); ctx.restore();
  /* the field's floor reflection — the same field mirrored across its baseline,
     at REFL.alpha, fading to nothing at the dashboard band */
  const FL=cy+ringR;
  ctx.save(); ctx.beginPath(); ctx.rect(cx-ringR, FL, ringR*2, Y(FMT.dashTop)-FL); ctx.clip();
  ctx.globalAlpha=REFL.alpha*0.6; ctx.translate(cx,2*FL-cy); ctx.scale(1,-1); ctx.rotate(yaw);
  ctx.drawImage(fOff,-cx,-cy,W,H); ctx.restore();
  const fgr=ctx.createLinearGradient(0,FL,0,Y(FMT.dashTop));
  fgr.addColorStop(0,"rgba(0,0,0,0)"); fgr.addColorStop(1,"rgba(0,0,0,0.88)");
  ctx.fillStyle=fgr; ctx.fillRect(cx-ringR, FL, ringR*2, Y(FMT.dashTop)-FL);
  const ra=ramp(lt,5);
  if(ra>0){ ctx.globalAlpha=.25*ra*(0.35+0.65*illum(cx,cy)); ctx.strokeStyle=PINK;
    ctx.beginPath(); ctx.arc(cx,cy,ringR,0,6.2832); ctx.stroke(); ctx.globalAlpha=1;
    for(let i=0;i<F.nonhits;i++){ const a=yaw+i*(6.283185307/F.nonhits)-1.5708, px=cx+Math.cos(a)*ringR, py=cy+Math.sin(a)*ringR;
      shadowDot(px,py); dot(px, py, 2.2, shadeCol(PINK,px,py), ra*illum(px,py)); } }
  dot(cx,cy,3,shadeCol(GOLD,cx,cy),.9*illum(cx,cy));
}

/* ================= PLATE 5 · THE SETS — one point per bit, exact */
function drawSets(t,lt){
  const sets=DATA.sets, base=Y(FMT.plotBase), colW=SW*(FMT.plotX1-FMT.plotX0)/sets.length,
        xStart=X(FMT.plotX0), perRow=13, ps=colW*0.92/perRow;
  sets.forEach((s,ci)=>{ const r=ramp(lt,ci); if(r<=0) return;
    const cxp=xStart+(ci+0.5)*colW, gw=perRow*ps, shown=Math.floor(s.bits*r),
          col=s.closed?GOLD:(ci%2?BLUE:VIOLET);
    for(let i=0;i<shown;i++){
      const row=Math.floor(i/perRow), colI=i%perRow, px=cxp-gw/2+colI*ps, py=base-row*ps;
      const ry=base+(base-py)*REFL.att;   /* the bit's reflection, mirrored across the baseline */
      dot(px, ry, ps*0.30, shadeCol(col,px,ry), REFL.alpha*illum(px,ry));
      shadowDot(px,py);
      dot(px, py, ps*0.30, shadeCol(col,px,py), 0.45+0.55*illum(px,py)); }
    if(s.rows && r>=1){ /* Set B's true row boundaries: gold hairlines ON the shared grid — height stays ∝ bits */
      let cum=0; ctx.globalAlpha=.85; ctx.strokeStyle=GOLD; ctx.lineWidth=1;
      for(let b=0;b<s.rows.length-1;b++){ cum+=s.rows[b];
        const brow=Math.floor(cum/perRow), y=base-brow*ps+ps*0.5;
        ctx.beginPath(); ctx.moveTo(cxp-gw/2-3,y); ctx.lineTo(cxp+gw/2+3,y); ctx.stroke(); }
      ctx.globalAlpha=1; }
    if(r>=1){ const topY=base-Math.ceil(s.bits/perRow)*ps-SH*0.012;
      ctx.globalAlpha=.9; ctx.strokeStyle=s.closed?GOLD:PINK; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(cxp-gw/2-4,topY); ctx.lineTo(cxp+gw/2+4,topY); ctx.stroke(); ctx.globalAlpha=1; } });
  ctx.strokeStyle=BASEL; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(0.05),base); ctx.lineTo(X(0.95),base); ctx.stroke();
}

/* ================= PLATE 6 · THE SORTING ENGINE — digital neurons and synapses.
   NEURONS: the 74 interactions of the sorting engine's full held record (generation-
   asserted in DATA.sorting) — one bar each, length = its recorded r_H (Stevens), a
   head dot at its head, shaded from the one light source.
   SYNAPSES: the connections between neurons, firing ONLY on real engine events —
   the arc between the two neurons the current Quicksort frame actually swaps, with
   a pulse travelling it inside that frame's own tick (the desk's 15 ms cadence).
   The gold audit chain across the tops is the synaptic web at rest.
   REACTION: when the sort settles, the field resolves into the engine's determined
   reaction — organized below the ε_H line, aside above it (49 / 25, exact).
   The step sequence is the desk's own vizFrames() output, recomputed at generation
   and verified frame-for-frame: 175 frames, no bar cap, no frame stride.
   Passes start from chain order every 4 s (pass 2,625 ms at cadence + a settled
   hold), and from local second 44 the sorted skyline rests under the slate.
   State is a pure function of the local clock, like every plate. */
const MAXV_S = 0.27;
let srtOrders=null, lastHeads=[];   /* lastHeads: the drawn neurons' screen heads (tap targets) */
function srtBuild(){
  const n=DATA.sorting.items.length; let cur=Array.from({length:n},(_,i)=>i);
  srtOrders=[cur.slice()];
  for(const sw of DATA.sorting.swaps){ const a=cur.slice(), tmp=a[sw[0]]; a[sw[0]]=a[sw[1]]; a[sw[1]]=tmp;
    srtOrders.push(a); cur=a; }
  srtOrders.push(cur.slice());            /* the settle frame — same order, frame 175 */
}
/* ================= THE MEASURED CUBE — Plate 6's scene space.
   The sorting engine lives in a cube: x = the interaction's slot, by formula
   x = -1 + 2·(slot+0.5)/74; y = its r_H, y = -1 + 2·(r_H/0.27), rising from the
   cube floor; z = its thread plane, z = (run-2)/2 over the 5 runs. The camera
   is three named constants (focal length, default azimuth, default elevation);
   the live view (drag / pinch / ?view=) orbits it. Projection: yaw around Y,
   pitch around X, perspective divide by (f - z') — every projected point is a
   stated function of (item, t, view). The ONE light sits in the cube at
   LIGHT3, derived from LIGHT by x' = 2x-1, y' = 1-2y, z' = +1.30 (in front of
   the field); marks are shaded in stage space by shadeCol at their projected
   position, so the series' single light law holds unchanged. */
const CUBE = { f:3.4, az:-0.38, el:0.34, fit:0.78 };   /* fit: the rotated cube fits the field */
const VIEW = { az:CUBE.az, el:CUBE.el, zoom:1 };
{ const vq = Q.get("view"); if(vq){ const p = vq.split(",").map(Number);
  if(p.length===3 && p.every(isFinite)){ VIEW.az=p[0]; VIEW.el=p[1]; VIEW.zoom=p[2]; } } }
const LIGHT3 = { x:2*LIGHT.x-1, y:1-2*LIGHT.y, z:1.30 };
function cubeProject(x,y,z){
  const ca=Math.cos(VIEW.az), sa=Math.sin(VIEW.az), ce=Math.cos(VIEW.el), se=Math.sin(VIEW.el);
  const rx=x*ca - z*sa, rz=x*sa + z*ca, ry=y*ce - rz*se, rz2=y*se + rz*ce;
  const persp=CUBE.f/(CUBE.f-rz2), unit=(Y(FMT.plotBase)-Y(FMT.plotTop))/2*CUBE.fit*persp*VIEW.zoom;
  return [X(FMT.heroCX)+rx*unit, Y(FMT.heroCY)-ry*unit, persp, rz2]; }
/* the sort's phase at local second s — one function, used by the draw and by
   the harness hooks, so the step the viewer sees is the step the checks read */
function sortPhase(s,D){
  const PASS_MS=D.pass_ms, TICK=D.tick_ms/1000;
  let o={fIdx:0, phase:"chain", passP:0, passNo:0, offIn:0, burstP:-1, burstScale:1};
  if(s>=44){ o.fIdx=D.frames; o.phase="sorted"; if(s<44.8){ o.burstP=(s-44)/0.8; o.burstScale=1.7; } }
  else if(s>=4){ o.passNo=Math.floor((s-4)/4)+1; o.offIn=s-4-(o.passNo-1)*4;
    if(o.offIn<PASS_MS/1000){ o.fIdx=Math.min(D.frames-1, Math.floor(o.offIn/TICK)); o.phase="sorting";
      o.passP=o.offIn/(PASS_MS/1000); }
    else { o.fIdx=D.frames; o.phase="hold";
      if(o.offIn<3.35){ o.burstP=(o.offIn-PASS_MS/1000)/0.725; o.burstScale=1; } } }
  return o; }
function drawSorting(t,lt){
  const D=DATA.sorting, it=D.items, n=it.length;
  if(!srtOrders) srtBuild();
  const s=lt*8;                            /* local seconds inside the 56 s slot */
  const PASS_MS=D.pass_ms, TICK=D.tick_ms/1000;
  const PH=sortPhase(s,D), fIdx=PH.fIdx, phase=PH.phase, passP=PH.passP,
        passNo=PH.passNo, offIn=PH.offIn, burstP=PH.burstP, burstScale=PH.burstScale;
  let hiPos=null;
  const order=srtOrders[fIdx];
  if(phase==="sorting"&&fIdx>=1&&fIdx<=D.swaps.length) hiPos=D.swaps[fIdx-1];
  const status = phase==="chain" ? "CHAIN ORDER · <b>"+n+"</b>"
    : phase==="sorting" ? "QUICKSORT · STEP <b>"+fIdx+" / "+D.frames+"</b>"
    : "SORTED · <b>"+n+"/"+n+"</b> BY r_H \u2191";
  if(stepBox.innerHTML!==status) stepBox.innerHTML=status;
  const x0=X(FMT.plotX0), x1=X(FMT.plotX1), base=Y(FMT.plotBase), top=Y(FMT.plotTop),
        plotH=base-top, yOf=v=>base-(v/MAXV_S)*plotH, bw=(x1-x0)/n;
  /* faint orbit rings turning on the weave's rotation — depth behind the data,
     lit from the one source (illumination sampled at the ring centre) */
  const oyaw=(t/8)*(6.283185307/56), ringIl=0.35+0.65*illum(X(FMT.heroCX),Y(FMT.heroCY));
  for(let k=0;k<4;k++){ ctx.globalAlpha=0.10*ringIl; ctx.strokeStyle=W7[(k*2)%7]; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(X(FMT.heroCX), Y(FMT.heroCY), SW*FMT.heroW/2*(0.80+0.09*k),
      SW*FMT.heroW/2*(0.80+0.09*k)*0.36, oyaw*0.6+k*0.45, 0, 6.2832); ctx.stroke(); ctx.globalAlpha=1; }
  /* the cube's furniture — its floor grid (one line per thread plane, one per
     8 slots), its edges, its r_H axis on the front-left vertical, and the
     refusal plane at ε_H: a gold plane through the cube at y(ε_H) */
  const ey=base-(EPS/MAXV_S)*plotH;      /* the flat ε height — the REACTION line's anchor */
  const seg3=(a,b,style,alpha,lw)=>{ const A=cubeProject(a[0],a[1],a[2]), B=cubeProject(b[0],b[1],b[2]);
    ctx.globalAlpha=alpha; ctx.strokeStyle=style; ctx.lineWidth=lw||1;
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke(); ctx.globalAlpha=1; };
  for(let zi=0; zi<5; zi++){ const z=-1+zi*0.5; seg3([-1,-1,z],[1,-1,z],GRID,.55); }
  for(let k2=0; k2<=9; k2++){ const gx=-1+2*(k2*8)/n; seg3([gx,-1,-1],[gx,-1,1],GRID,.4); }
  seg3([-1,-1,1],[1,-1,1],BASEL,.9); seg3([-1,-1,-1],[-1,-1,1],BASEL,.7);
  seg3([-1,-1,1],[-1,1,1],BASEL,.9); seg3([1,-1,1],[1,1,1],BASEL,.6);
  seg3([-1,1,1],[1,1,1],BASEL,.5); seg3([-1,-1,-1],[1,-1,-1],BASEL,.45);
  ctx.font=TP.grid+"px ui-monospace,Menlo,monospace"; ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let gv=0.05; gv<MAXV_S; gv+=0.05){ const P=cubeProject(-1,-1+2*gv/MAXV_S,1);
    ctx.fillStyle=MUT; ctx.fillText(gv.toFixed(2), P[0]-4, P[1]); }
  { const yE=-1+2*EPS/MAXV_S, c1=cubeProject(-1,yE,-1), c2=cubeProject(1,yE,-1),
        c3=cubeProject(1,yE,1), c4=cubeProject(-1,yE,1);
    ctx.globalAlpha=.055; ctx.fillStyle=GOLD; ctx.beginPath();
    ctx.moveTo(c1[0],c1[1]); ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.lineTo(c4[0],c4[1]);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=.6; ctx.strokeStyle=GOLD; ctx.lineWidth=1.1; ctx.setLineDash([6,5]); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    ctx.font=TP.grid+"px ui-monospace,Menlo,monospace"; ctx.textAlign="left"; ctx.textBaseline="bottom";
    ctx.fillStyle=GOLD; ctx.fillText("ε_H 0.15 — REFUSAL PLANE", c4[0]+4, c4[1]-2); }
  /* the neurons — every interaction a bar in the cube. x from its slot (the
     two items a step swaps glide between their slots on the step's own fraction
     u, eased — a pure function of (frame, u)); y from its r_H; z from its thread
     plane. Shadows are the one light's rays through the heads, met at the cube
     floor; reflections mirror the bars under the floor at REFL.att; head dots
     ride the heads; every mark is shaded by shadeCol at its projected position. */
  const invOf=ord=>{ const inv=new Array(n); for(let sl=0;sl<n;sl++) inv[ord[sl]]=sl; return inv; };
  const fA=(phase==="sorting"&&fIdx>=1)?fIdx-1:fIdx;
  const invA=invOf(srtOrders[fA]), invB=invOf(srtOrders[fIdx]);
  const uStep=phase==="sorting"?ease(((offIn*1000)%D.tick_ms)/D.tick_ms):0;
  const slotX=p2=>-1+2*(p2+0.5)/n, scr=[];
  for(let item=0; item<n; item++){ const v=it[item], slot=invB[item],
        grow = s<4 ? ease(clamp((s-0.2-slot*0.012)/1.1,0,1)) : 1,
        xa=slotX(invA[item]), xx=xa+(slotX(slot)-xa)*uStep, zz=(v.run-2)*0.5,
        yH=-1+2*(v.r/MAXV_S)*grow;
    scr.push({ item, xx, yH, zz, hp:cubeProject(xx,yH,zz), bp:cubeProject(xx,-1,zz),
               col: v.d==="a" ? TEAL : PINK,
               hot: !!(hiPos && (item===order[hiPos[0]] || item===order[hiPos[1]])) }); }
  for(const q of scr.slice().sort((a,b)=>a.bp[3]-b.bp[3])){   /* painter: far first */
    const rp=cubeProject(q.xx, -1-(q.yH+1)*REFL.att, q.zz);   /* the floor reflection */
    ctx.globalAlpha=REFL.alpha*illum((q.bp[0]+rp[0])/2,(q.bp[1]+rp[1])/2);
    ctx.strokeStyle=shadeCol(q.col,rp[0],rp[1]); ctx.lineWidth=Math.max(1,2.2*q.bp[2]);
    ctx.beginPath(); ctx.moveTo(q.bp[0],q.bp[1]); ctx.lineTo(rp[0],rp[1]); ctx.stroke(); ctx.globalAlpha=1;
    const sf=(-1-LIGHT3.y)/(q.yH-LIGHT3.y);                    /* the cast shadow */
    if(sf>1){ const sp=cubeProject(LIGHT3.x+(q.xx-LIGHT3.x)*sf, -1, LIGHT3.z+(q.zz-LIGHT3.z)*sf);
      ctx.globalAlpha=.30; ctx.strokeStyle="#000000"; ctx.lineWidth=Math.max(1,2*q.bp[2]);
      ctx.beginPath(); ctx.moveTo(q.bp[0],q.bp[1]); ctx.lineTo(sp[0],sp[1]); ctx.stroke(); ctx.globalAlpha=1; }
    /* a firing neuron changes by illumination only: its bar and head take the
       SHADE formula at I_eff = 1 — pale toward the light colour against the
       saturated field. Nothing else marks the step: no underlay, no tick. */
    const sc=q.hot ? shadeFire(q.col) : shadeCol(q.col,q.hp[0],q.hp[1]);
    ctx.globalAlpha=.93; ctx.strokeStyle=sc;
    ctx.lineWidth=Math.max(1,2.4*q.hp[2]);
    ctx.beginPath(); ctx.moveTo(q.bp[0],q.bp[1]); ctx.lineTo(q.hp[0],q.hp[1]); ctx.stroke();
    ctx.globalAlpha=1;
    const headHex=(phase==="hold"||phase==="sorted") ? GOLD : q.col;
    const headCol=q.hot ? shadeFire(headHex) : shadeCol(headHex,q.hp[0],q.hp[1]);
    dot(q.hp[0], q.hp[1], headR(q.hp[0],q.hp[1])*q.hp[2], headCol, q.hot ? 1 : illum(q.hp[0],q.hp[1]));
    ctx.globalAlpha=.9; ctx.fillStyle=sc;          /* a presence tick at the floor — */
    ctx.fillRect(q.bp[0]-2, q.bp[1]-1, 4, 2); ctx.globalAlpha=1;  /* even r_H = 0 is seen */
    if((phase==="hold"||phase==="sorted")&&q.yH>-1){ ctx.fillStyle=shadeCol(GOLD,q.hp[0],q.hp[1]);
      ctx.globalAlpha=.85; ctx.fillRect(q.hp[0]-2.2*q.hp[2], q.hp[1]-0.6, 4.4*q.hp[2], 1.2); ctx.globalAlpha=1; } }
  lastHeads=scr.map(q=>({item:q.item, x:q.hp[0], y:q.hp[1]}));
  const tops=[]; for(let p2=0;p2<n;p2++){ const q=scr[order[p2]]; tops.push([q.hp[0],q.hp[1]]); }
  /* the synaptic web — the audit chain across the slots' heads, shaded per segment */
  ctx.lineWidth=1.3;
  for(let i=0;i<tops.length-1;i++){ const mx=(tops[i][0]+tops[i+1][0])/2, my=(tops[i][1]+tops[i+1][1])/2;
    ctx.globalAlpha=.55; ctx.strokeStyle=shadeCol(GOLD,mx,my);
    ctx.beginPath(); ctx.moveTo(tops[i][0],tops[i][1]); ctx.lineTo(tops[i+1][0],tops[i+1][1]); ctx.stroke(); }
  ctx.globalAlpha=1;
  /* THE FIRING SYNAPSE — only on a real step: the arc joins the two neurons this
     frame swaps, and one pulse travels it inside the frame's own tick */
  if(hiPos){ const A=tops[hiPos[0]], B=tops[hiPos[1]],
      my=Math.min(A[1],B[1])-16-10*Math.sin(passP*Math.PI);
    ctx.globalAlpha=.9; ctx.strokeStyle=GOLD; ctx.lineWidth=1.4; ctx.beginPath();
    ctx.moveTo(A[0],A[1]-3); ctx.quadraticCurveTo((A[0]+B[0])/2,my,B[0],B[1]-3); ctx.stroke(); ctx.globalAlpha=1;
    const u=((offIn*1000)%D.tick_ms)/D.tick_ms;
    const pu=qpoint(A[0],A[1]-3,(A[0]+B[0])/2,my,B[0],B[1]-3,u);
    dot(pu[0],pu[1], headR(pu[0],pu[1])*1.6, LIGHT.color, .95);
    dot(A[0],A[1]-3,2.4,shadeFire(GOLD),1); dot(B[0],B[1]-3,2.4,shadeFire(GOLD),1); }
  /* the burst — at the settle frame of each pass the field discharges: one orb per
     neuron, sprayed by its own hash (determined, never random), with trails, lit
     from the one source at the orb's own position */
  if(burstP>=0){ const bp=ease(burstP);
    for(let i=0;i<n;i++){ const o=tops[i], a=hash01(i*7+3)*6.283185307, dist=(6+34*hash01(i*3+11))*burstScale*bp;
      const px=o[0]+Math.cos(a)*dist*0.62, py=o[1]+Math.sin(a)*dist*0.38-bp*7, il=illum(px,py);
      ctx.globalAlpha=0.30*(1-burstP)*il; ctx.strokeStyle=W7[i%7]; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(o[0],o[1]); ctx.lineTo(px,py); ctx.stroke();
      ctx.globalAlpha=0.9*(1-burstP)*il; ctx.fillStyle=W7[i%7];
      ctx.beginPath(); ctx.arc(px,py,1.35,0,6.2832); ctx.fill(); ctx.globalAlpha=1; } }
  /* run segments under the field while chain order holds (staggered rows at the
     2% annotation size); the REACTION when it rests */
  ctx.font=TP.seg+"px ui-monospace,Menlo,monospace"; ctx.textAlign="center"; ctx.textBaseline="top";
  const segA = phase==="chain" ? 0.95 : phase==="sorting" ? clamp(1-passP*1.5,0,1)*0.95 : 0;
  if(segA>0.02){ let acc=0;
    for(let gI=0; gI<D.runs.length; gI++){ const c0=acc; acc+=D.runs[gI];
      const gx0=x0+(c0/n)*(x1-x0), gx1=x0+(acc/n)*(x1-x0);
      ctx.globalAlpha=segA; ctx.fillStyle=MUT;
      ctx.fillText(D.run_names[gI]+" "+D.runs[gI], (gx0+gx1)/2, base+SH*0.02+(gI%2)*SH*0.034); ctx.globalAlpha=1; } }
  if(phase==="hold"||phase==="sorted"){ /* the REACTION — read in the field, under the
       refusal plane, where the resting slate cannot cover it */
    const rTxt="REACTION — "+D.admit+" ORGANIZED · "+D.refuse+" ASIDE · ε_H DECIDES",
          rW=ctx.measureText(rTxt).width, rY=ey+SH*0.044;
    ctx.globalAlpha=.78; ctx.fillStyle="#040810";
    ctx.fillRect(X(0.5)-rW/2-7, rY-2, rW+14, TP.seg+5);
    ctx.globalAlpha=.95; ctx.fillStyle=GOLD; ctx.fillText(rTxt, X(0.5), rY); ctx.globalAlpha=1; }
  /* the dashboard band — while the engine works; the slate takes the band at rest */
  if(s<44.8){ const exVal = hiPos ? "POS "+hiPos[0]+" ↔ "+hiPos[1] : (phase==="chain" ? "—" : "SETTLED");
    const exSub = hiPos ? "ITEM "+order[hiPos[0]]+" ↔ ITEM "+order[hiPos[1]]
                        : (phase==="chain" ? "NO EXCHANGE YET" : "EVERY BAR PLACED");
    drawPanels([
      ["STEP", fIdx+" / "+D.frames, "PASS "+fmtN(D.pass_ms)+" MS", BASEL],
      ["PASS", phase==="chain" ? "—" : (phase==="sorted" ? "DONE" : passNo+" / 10"),
             phase==="sorting" ? fmtN(Math.floor(offIn*1000))+" MS IN" : (phase==="chain" ? "FIRST PASS AT 4 S" : "SETTLE HOLD"), TEAL],
      ["EXCHANGE", exVal, exSub, GOLD],
      ["THE GATE", D.admit+" ORGANIZED", D.refuse+" ASIDE · ε_H", BASEL]]); }
}

/* ================= PLATE 7 · THE WEAVE — the floor itself, as a graph */
function drawWeave(t){
  const cx=X(FMT.heroCX), cy=Y(FMT.heroCY), R=FIELD_R, yaw=(t/8)*(6.283185307/56);
  const P=[]; for(let k=0;k<7;k++){ const a=yaw+k*(6.283185307/7)-1.5708; P.push([cx+Math.cos(a)*R, cy+Math.sin(a)*R]); }
  const FL=2*(cy+R);   // mirror line = 2 × the field's baseline
  const hep=(ctx2,alphaMul,fy)=>{ ctx2.lineWidth=1;
    for(let i=0;i<7;i++) for(let j=i+1;j<7;j++){
      const mx=(P[i][0]+P[j][0])/2, my=(P[i][1]+P[j][1])/2, iy=fy(my);
      ctx2.globalAlpha=.10*alphaMul*(0.35+0.65*illum(mx,iy)); ctx2.strokeStyle=shadeCol(W7[i],mx,iy);
      ctx2.beginPath(); ctx2.moveTo(P[i][0],P[i][1]); ctx2.lineTo(P[j][0],P[j][1]); ctx2.stroke(); }
    ctx2.globalAlpha=1; };
  /* the heptagon's floor reflection, mirrored across its baseline */
  ctx.save(); ctx.beginPath(); ctx.rect(SX, FL/2, SW, Y(FMT.dashTop)-FL/2); ctx.clip();
  ctx.save(); ctx.translate(0,FL); ctx.scale(1,-1); hep(ctx,REFL.alpha,y=>FL-y); ctx.restore(); ctx.restore();
  /* its cast shadow — the silhouette offset along the light direction from its centre */
  const dvx=cx-LX, dvy=cy-LY, dm=Math.hypot(dvx,dvy)||1, so=SH*0.012;
  ctx.save(); ctx.translate(dvx/dm*so, dvy/dm*so);
  ctx.lineWidth=1;
  for(let i=0;i<7;i++) for(let j=i+1;j<7;j++){ ctx.globalAlpha=.16; ctx.strokeStyle="#000000";
    ctx.beginPath(); ctx.moveTo(P[i][0],P[i][1]); ctx.lineTo(P[j][0],P[j][1]); ctx.stroke(); }
  ctx.restore(); ctx.globalAlpha=1;
  hep(ctx,1,y=>y);
  for(let i=0;i<7;i++){ const nx=P[(i+1)%7],
      mx=(P[i][0]+nx[0])/2, my=(P[i][1]+nx[1])/2;
    stream(P[i][0],P[i][1],nx[0],nx[1],0,shadeCol(W7[i],mx,my),.5*(0.35+0.65*illum(mx,my)),1.2); }
  P.forEach((p,k)=>{ shadowDot(p[0],p[1]);
    dot(p[0],p[1],3.4*(0.7+0.6*illum(p[0],p[1])),shadeCol(W7[k],p[0],p[1]),.95*illum(p[0],p[1])); });
  dot(cx,cy,3,shadeCol(GOLD,cx,cy),.9*illum(cx,cy));
}

/* ambient dust — DETERMINISTIC hash field, decorative only (the base's rule, labeled
   on the slate); its brightness is the one light's, at each mote’s own position */
function hash01(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function drawAmbient(t){
  for(let i=0;i<70;i++){ const x=SX+hash01(i*2+1)*SW, y=SY+hash01(i*3+7)*SH;
    dot(x,y,1.1,INK, (0.02+0.08*illum(x,y))*(0.5+0.5*Math.sin(t*.7+i))); }
}

/* ---------- the transport — time is the fourth axis, and it is driven, not
   merely watched. vt() reads the transport: a base time plus real elapsed time
   while playing. Play runs at the true cadence — the series clock is real time,
   so Plate 6's Quicksort steps land every 15 ms of it, never silently sped.
   Pause freezes t: at a frozen t the scene is a still frame, a pure function
   of (t, data, view). Scrub and step set t exactly. ?t= starts paused at that
   t — the frozen renders the harness verifies. Nav shifts T_OFF; the floor
   never moves. */
let T_OFF=0;
const transport={ paused: T_OVR!==null, base: T_OVR||0, since: performance.now() };
function vt(){ return transport.base + (transport.paused?0:(performance.now()-transport.since)/1000) + T_OFF; }
function setT(v){ T_OFF=0; transport.base=v; transport.since=performance.now(); }
function slotAt(t){ if(SLOT_OVR!==null) return SLOT_OVR; return Math.floor(t/SLOT_S)%N_SLOTS; }
function ltAt(t){ if(SLOT_OVR!==null) return 6.6; return (t%SLOT_S)/FRAME_S; }

/* ---------- nav */
const navEl=document.getElementById("nav"), dots=[];
for(let k=0;k<N_SLOTS;k++){ const b=document.createElement("button"); b.className="dot"; b.textContent=k+1;
  b.onclick=()=>{ T_OFF += (k-slotAt(vt()))*SLOT_S; }; navEl.appendChild(b); dots.push(b); }
const sndBtn=document.createElement("button"); sndBtn.className="snd"; sndBtn.textContent="♪ sound off";
sndBtn.onclick=()=>{ soundOn=!soundOn;
  if(soundOn){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended"){ const rp=actx.resume(); if(rp&&rp.catch) rp.catch(()=>{}); } }catch(e){} }
  sndBtn.textContent=soundOn?"♪ sound on":"♪ sound off"; };
navEl.appendChild(sndBtn);

/* ---------- the interface — touch first: drag, pinch, spread, tap.
   On Plate 6 a one-finger drag orbits the cube and a pinch zooms it; on every
   other plate a horizontal drag scrubs t. A tap selects: on Plate 6 the neuron
   whose head it lands on — its record opens in the inspector (source id, r_H,
   verdict, audit digest, all read from DATA — the viewer-checkable provenance
   path); anywhere, the string it lands on — its bound movement source is
   named. The chips toggle each wire; VIEW resets the camera. When paused,
   nothing moves: the scene is the data at that t. */
const inspector=document.getElementById("inspector"), scrubEl=document.getElementById("scrub"),
      playBtn=document.getElementById("playBtn"), tRead=document.getElementById("tRead");
const stringOff=new Set();
function showInspector(html){ inspector.innerHTML=html; inspector.style.display="block"; }
function hideInspector(){ inspector.style.display="none"; }
function neuronRecord(item){ const D=DATA.sorting, v=D.items[item];
  return { item, run: D.run_names[v.run], r: v.r,
           verdict: v.d==="a" ? "ADMIT · ORGANIZED" : "REFUSE · ASIDE", audit: D.audits[item] }; }
function tapNeuron(item){ const r=neuronRecord(item);
  showInspector(`<span class="h">NEURON ${r.item}</span> · ${r.run}<br/>r_H ${r.r.toFixed(6)} · ${r.verdict}<br/>`+
    `audit ${r.audit}<br/><span class="d">source: the Seraphim desk record · verdict recomputed by `+
    `organize.py at generation — check it against the JUDGE slate</span>`); }
function tapString(k){ const S=DATA.strings;
  showInspector(`<span class="h">STRING ${k}</span> · <span style="color:${S.hues[k]}">■</span> ${S.names[k]}<br/>${S.descs[k]}`); }
{ const row=document.getElementById("chipRow");
  DATA.strings.names.forEach((nm,k)=>{ const c=document.createElement("button"); c.className="chip";
    c.innerHTML=`<span class="cdot" style="background:${DATA.strings.hues[k]}"></span>${k}`;
    c.title=nm; c.setAttribute("aria-label","toggle string "+k+" — "+nm);
    c.onclick=()=>{ if(stringOff.has(k)){ stringOff.delete(k); c.classList.remove("off"); }
      else { stringOff.add(k); c.classList.add("off"); } tapString(k); };
    row.appendChild(c); });
  const rv=document.createElement("button"); rv.className="chip"; rv.textContent="VIEW";
  rv.title="reset the cube view"; rv.setAttribute("aria-label","reset view");
  rv.onclick=()=>{ VIEW.az=CUBE.az; VIEW.el=CUBE.el; VIEW.zoom=1; };
  row.appendChild(rv); }
playBtn.onclick=()=>{ transport.base=vt()-T_OFF; T_OFF=0; transport.since=performance.now();
  transport.paused=!transport.paused; };
function stepQuantum(){ const t=vt(), slot=slotAt(t);
  if(slot===5) return (t%SLOT_S)>=4 ? 0.015 : 8;    /* Plate 6 sorting: one Quicksort step */
  if(slot===2) return 1.6;                          /* the register: one hourly point */
  return 8; }                                       /* everywhere else: one pattern-frame */
document.getElementById("stepFwd").onclick=()=>setT(vt()+stepQuantum());
document.getElementById("stepBack").onclick=()=>setT(Math.max(0, vt()-stepQuantum()));
let scrubbing=false;
scrubEl.addEventListener("pointerdown",()=>scrubbing=true);
scrubEl.addEventListener("pointerup",()=>scrubbing=false);
scrubEl.addEventListener("input",()=>{ const cyc=Math.floor(vt()/(SLOT_S*N_SLOTS))*(SLOT_S*N_SLOTS);
  setT(cyc + Number(scrubEl.value)/1000); });
function handleTap(x,y){ const slot=slotAt(vt());
  if(slot===5){ let best=null, bd=18;
    for(const h of lastHeads){ const d=Math.hypot(h.x-x, h.y-y); if(d<bd){ bd=d; best=h; } }
    if(best){ tapNeuron(best.item); return; } }
  const S=DATA.strings;
  if(S && slot!==6){ const t=vt(), lt=ltAt(t),
      x0=X(FMT.plotX0), x1=X(FMT.plotX1), top=Y(FMT.plotTop), base=Y(FMT.plotBase), ph=base-top;
    for(let k=0;k<7;k++){ if(stringOff.has(k)) continue; const ser=S.series[k],
        mean=ser.reduce((a,b)=>a+b,0)/ser.length, cy=top+(k+0.5)*ph/7, amp=ph*0.052;
      for(let s2=0;s2<=72;s2++){ const p=stringPt(ser,mean,x0,x1,cy,amp,s2/72);
        if(Math.hypot(p[0]-x, p[1]-y)<12){ tapString(k); return; } } } }
  hideInspector(); }
const pointers=new Map(); let dragMoved=0, pinchD0=0, tapCand=null;
cv.addEventListener("pointerdown", e=>{ try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragMoved=0; tapCand={x:e.clientX, y:e.clientY, t:performance.now()}; }
  if(pointers.size===2){ const p=[...pointers.values()];
    pinchD0=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); tapCand=null; } });
cv.addEventListener("pointermove", e=>{ if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId), dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragMoved+=Math.abs(dx)+Math.abs(dy);
    if(slotAt(vt())===5){ VIEW.az+=dx*0.008; VIEW.el=clamp(VIEW.el+dy*0.005, -0.05, 1.25); }
    else if(dx!==0) setT(Math.max(0, vt()+dx*0.08)); }
  else if(pointers.size===2){ const p=[...pointers.values()],
      d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if(pinchD0>0 && d>0) VIEW.zoom=clamp(VIEW.zoom*d/pinchD0, 0.6, 2.4); pinchD0=d; } });
function endPointer(e){ pointers.delete(e.pointerId);
  if(tapCand && pointers.size===0){ if(performance.now()-tapCand.t<400 && dragMoved<10)
    handleTap(tapCand.x, tapCand.y); tapCand=null; } }
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", endPointer);

/* harness/uniformity hook: the shared constants, readable from outside */
/* ================= THE SEVEN STRINGS — the series' wires.
   Seven strands, one per weave hue, run through the plot field of every plate
   behind the data (on the closing plate the weave heptagon is the web itself).
   String k's waveform is its bound source's own data series — computed in
   inject_data.py from the same source bytes as the plates; the binding table is
   on the design board. Displacement at u = the series value at u, centred on
   the series mean, amplitude a named fraction of the field height. Strings are
   lit by the one light through shadeCol, like every other mark.
   Each string carries one bead, and the bead moves only on its source's events:
   on the plate whose subject is the string's own source it rides that plate's
   event front (gate verdict-ignition · seat-transit phase · register growth ·
   frontier sweep · sets fill); on Plate 6 string 1's bead is the firing synapse
   itself, drawn in drawSorting and not duplicated here. Everywhere else the
   bead makes one traverse during the string's own pattern-frame — the floor's
   staggered ignition lights frame k's string k. Nothing moves for decoration. */
function stringPt(ser,mean,x0,x1,cy,amp,u){
  const n=ser.length, fi=u*(n-1), i0=Math.min(n-2,Math.floor(fi)), fr=fi-i0;
  return [x0+u*(x1-x0), cy+((ser[i0]*(1-fr)+ser[i0+1]*fr)-mean)*amp*2]; }
function stringBeadU(slot,k,lt,t){
  if(slot===0&&k===0) return clamp(lt/7,0,1);                 /* verdict ignition: groups 0..6 over the slot */
  if(slot===1&&k===3) return (t*0.011)%1;                     /* the transits' own phase rate */
  if(slot===2&&k===2) return ease(clamp(lt/6,0,1));           /* register growth front (the staircase's upto) */
  if(slot===3&&k===4) return (t/448)%1;                       /* the sweep: one field turn per 448 s */
  if(slot===4&&k===5) return DATA.sets.reduce((a,_,ci)=>a+ramp(lt,ci),0)/DATA.sets.length; /* aggregate fill front */
  if(slot===5&&k===1) return -1;                              /* the firing synapse is this string's bead */
  const f=Math.floor(lt); return f===k ? lt-k : -1;           /* the floor's ignition: frame k, string k */
}
function drawStrings(t,lt,slot){
  const S=DATA.strings; if(!S) return;
  const x0=X(FMT.plotX0), x1=X(FMT.plotX1), top=Y(FMT.plotTop), base=Y(FMT.plotBase),
        ph=base-top, SEG=72;
  for(let k=0;k<7;k++){ if(stringOff.has(k)) continue; const ser=S.series[k], mean=ser.reduce((a,b)=>a+b,0)/ser.length,
        cy=top+(k+0.5)*ph/7, amp=ph*0.052;
    ctx.lineWidth=1.1; let prev=null;
    for(let s2=0;s2<=SEG;s2++){ const p=stringPt(ser,mean,x0,x1,cy,amp,s2/SEG);
      if(prev){ ctx.globalAlpha=0.20; ctx.strokeStyle=shadeCol(S.hues[k],(prev[0]+p[0])/2,(prev[1]+p[1])/2);
        ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); }
      prev=p; }
    ctx.globalAlpha=1;
    const bu=stringBeadU(slot,k,lt,t);
    if(bu>=0){ const bp=stringPt(ser,mean,x0,x1,cy,amp,bu);
      dot(bp[0],bp[1],1.8,shadeCol(S.hues[k],bp[0],bp[1]),0.9*illum(bp[0],bp[1])); } }
}
window.MH = { FMT, TYPE, LIGHT, REFL, SHADOW, SHADE,
  stage:()=>({x:SX,y:SY,w:SW,h:SH}), illum:(px,py)=>illum(px,py),
  shade:(hex,px,py)=>shadeCol(hex,px,py),
  stringsLens: DATA.strings ? DATA.strings.series.map(s=>s.length) : [],
  stringsHues: DATA.strings ? DATA.strings.hues : [],
  /* the interface hooks — the harness drives the same state the viewer touches */
  view: ()=>({az:VIEW.az, el:VIEW.el, zoom:VIEW.zoom}),
  transportState: ()=>({t:vt(), paused:transport.paused}),
  sortStep: ()=>sortPhase(vt()%SLOT_S, DATA.sorting),
  projectHeads: ()=>lastHeads.map(h=>({item:h.item, x:h.x, y:h.y})),
  recordOf: item=>neuronRecord(item),
  stringsOff: ()=>[...stringOff],
  stringPointAt: (k,u)=>{ const S=DATA.strings, ser=S.series[k],
      x0=X(FMT.plotX0), x1=X(FMT.plotX1), top=Y(FMT.plotTop), base=Y(FMT.plotBase), ph=base-top,
      mean=ser.reduce((a,b)=>a+b,0)/ser.length,
      p=stringPt(ser,mean,x0,x1,top+(k+0.5)*ph/7, ph*0.052, u); return {x:p[0], y:p[1]}; },
  canvasSize: ()=>({w:cv.width, h:cv.height, dpr:DPR}) };

/* ---------- main loop: state = f(t) only */
function frame(){
  const t=vt(), F=Math.floor(t/FRAME_S), slot=slotAt(t), lt=ltAt(t);
  if(slot!==curSlot){ curSlot=slot; renderLabels(slot);
    dots.forEach((d,k)=>d.classList.toggle("on",k===slot)); }
  ctx.fillStyle="#000000"; ctx.fillRect(0,0,W,H);
  drawAmbient(t);
  if(slot!==6) drawStrings(t,lt,slot);   /* the seven wires run behind every plate's data */
  if(slot===0) drawGate(t,lt);
  else if(slot===1) drawPipeline(t,lt);
  else if(slot===2) drawRegister(t,lt);
  else if(slot===3) drawFrontier(t,lt,Math.floor(t/SLOT_S));
  else if(slot===4) drawSets(t,lt);
  else if(slot===5) drawSorting(t,lt);
  else drawWeave(t);
  if(slot!==5 && slot!==6 && lt<5.6) drawPanels(panelsFor(slot));
  /* the one light's vignette — falloff over the whole stage, centred on the source */
  const vg=ctx.createRadialGradient(LX,LY,SH*0.30,LX,LY,SH*1.05);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.40)");
  ctx.fillStyle=vg; ctx.fillRect(SX,SY,SW,SH);
  slateEl.style.opacity = slot===6 ? 0 : clamp(lt-5.6,0,1);
  const ftxt="F"+F+" · PLATE "+(slot+1)+"/7 · 0.125 FPS · WEAVE FLOOR";
  if(frameBox.textContent!==ftxt) frameBox.textContent=ftxt;
  /* the transport readout — the viewer drives the same t the harness freezes */
  const pb=transport.paused?"▶":"❚❚"; if(playBtn.textContent!==pb) playBtn.textContent=pb;
  if(!scrubbing) scrubEl.value=Math.round((t%(SLOT_S*N_SLOTS))*1000);
  const rt="T+"+(t%(SLOT_S*N_SLOTS)).toFixed(1)+"s"+
    (slot===5 ? " · STEP "+sortPhase(lt*8, DATA.sorting).fIdx+"/"+DATA.sorting.frames
              : " · PLATE "+(slot+1)+"/7");
  if(tRead.textContent!==rt) tRead.textContent=rt;
  clockAudio(F,slot);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
