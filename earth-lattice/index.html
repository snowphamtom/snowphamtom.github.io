const nodesById = {};
MODEL.nodes.forEach(n => { nodesById[n.id] = n; });
function vpos(lon, lat){
  return {x: MAP.x0 + (lon + 180) / 360 * MAP.w, y: MAP.y0 + (90 - lat) / 180 * MAP.h};
}
function parseId(id){
  const m = id.match(/^N(-?\d+)_(-?\d+)$/);
  return {lon: parseInt(m[1], 10), lat: parseInt(m[2], 10)};
}
let sel = null, edgeSel = null, region = null;
const q = new URLSearchParams(location.search);
if (q.get("sel") && nodesById[q.get("sel")]) sel = q.get("sel");
if (q.get("region") && nodesById[q.get("region")]) region = q.get("region");
function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function shade(base, u, v){
  const d2 = (u - LIGHT.x) * (u - LIGHT.x) + (v - LIGHT.y) * (v - LIGHT.y);
  const illum = LIGHT.i / (1 + LIGHT.fall * d2);
  const step = Math.floor(illum * 16) / 16;
  let br = 0.42 + 0.58 * step;
  let c = hexRgb(base).map(x => Math.round(x * br));
  if (illum > 0.75){
    const t = hexRgb(LIGHT.color);
    c = c.map((x, i) => Math.round(x + (t[i] - x) * 0.35));
  }
  return "rgb(" + c.join(",") + ")";
}
// Project lon/lat to stage coords under the current view (full or region).
function project(lon, lat){
  if (!region){
    const p = vpos(lon, lat);
    return p;
  }
  const c = parseId(region);
  const clon = c.lon, clat = c.lat;
  let dlon = lon - clon;
  while (dlon > 180) dlon -= 360;
  while (dlon < -180) dlon += 360;
  const x = MAP.x0 + ((dlon + 60) / 120) * MAP.w;
  const y = MAP.y0 + ((clat + 30 - lat) / 60) * MAP.h;
  return {x: x, y: y};
}
function inMap(x, y){
  return x >= MAP.x0 && x <= MAP.x0 + MAP.w && y >= MAP.y0 && y <= MAP.y0 + MAP.h;
}
function draw(){
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, 390, 650);
  ctx.save();
  ctx.beginPath(); ctx.rect(MAP.x0, MAP.y0, MAP.w, MAP.h); ctx.clip();
  // Base image: full equirectangular, or a 120x60 deg window centred on region.
  if (!region){
    ctx.drawImage(img, MAP.x0, MAP.y0, MAP.w, MAP.h);
  } else {
    const c = parseId(region);
    const clon = c.lon, clat = c.lat;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    let lonA = clon - 60, lonB = clon + 60;
    const latT = Math.min(90, clat + 30), latB = Math.max(-90, clat - 30);
    const segs = [];
    if (lonA >= -180 && lonB <= 180){
      segs.push([lonA, lonB]);
    } else if (lonB > 180){
      segs.push([lonA, 180]); segs.push([-180, lonB - 360]);
    } else {
      segs.push([lonA + 360, 180]); segs.push([-180, lonB]);
    }
    segs.forEach(sg => {
      const sx = (sg[0] + 180) / 360 * iw;
      const sw = (sg[1] - sg[0]) / 360 * iw;
      const sy = (90 - latT) / 180 * ih;
      const sh = (latT - latB) / 180 * ih;
      // Map the segment start through the same wrap as project().
      let d0 = sg[0] - clon;
      while (d0 > 180) d0 -= 360;
      while (d0 < -180) d0 += 360;
      const dx2 = MAP.x0 + ((d0 + 60) / 120) * MAP.w;
      const dw = sw / iw * MAP.w * (360 / 120);
      const dy = MAP.y0 + ((clat + 30 - latT) / 60) * MAP.h;
      const dh = sh / ih * MAP.h * (180 / 60);
      ctx.drawImage(img, sx, sy, sw, sh, dx2, dy, dw, dh);
    });
  }
  // Lattice edges (formula framework).
  ctx.lineWidth = 1;
  MODEL.edges.forEach(e => {
    const a = parseId(e[0]), b = parseId(e[1]);
    const pa = project(a.lon, a.lat), pb = project(b.lon, b.lat);
    if (!inMap(pa.x, pa.y) && !inMap(pb.x, pb.y)) return;
    ctx.strokeStyle = (edgeSel === e[0] + "|" + e[1]) ? "#c9a227" : "rgba(53,255,196,0.45)";
    ctx.lineWidth = (edgeSel === e[0] + "|" + e[1]) ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });
  // Nodes: plain small spheres, shaded by the one light.
  MODEL.nodes.forEach(n => {
    const p = project(n.lon, n.lat);
    if (!inMap(p.x, p.y)) return;
    const r = region ? 5 : 4;
    ctx.fillStyle = shade(n.hue, p.x / 390, p.y / 650);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    if (sel === n.id){
      ctx.strokeStyle = "#c9a227"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2); ctx.stroke();
    }
  });
  ctx.restore();
  // Dashboard.
  document.getElementById("hudn").textContent = MODEL.node_count;
  document.getElementById("d1").textContent =
    region ? "REGION " + region + " \u00b7 3\u00d7 \u00b7 120\u00d7 60 DEG WINDOW"
           : "LATTICE 30\u00b0 \u00b7 62 VERTICES \u00b7 132 EDGES";
  document.getElementById("d2").textContent =
    "NODES " + MODEL.node_count + " LAND \u00b7 OCEAN REMOVED \u00b7 PROXY = GREEN / LAND";
  const d3 = document.getElementById("d3"), d4 = document.getElementById("d4"), d5 = document.getElementById("d5");
  if (sel && nodesById[sel]){
    const n = nodesById[sel];
    d3.textContent = "NODE " + n.id + " \u00b7 LON " + n.lon + " \u00b7 LAT " + n.lat;
    d4.textContent = "PROXY " + n.proxy.toFixed(4) + " \u00b7 LANDPX " + n.landpx + " \u00b7 BAND " + n.band;
    d5.textContent = "NEIGHBORS " + n.neighbors.join(" ");
  } else if (edgeSel){
    d3.textContent = "EDGE " + edgeSel;
    d4.textContent = "LATTICE: PARALLEL OR MERIDIAN SEGMENT, 30 DEG STEP";
    d5.textContent = "FRAMEWORK BY FORMULA, NOT A DISCOVERY";
  } else if (window.__oceanMsg){
    d3.textContent = "OCEAN REMOVED \u2014 NO NODE HERE";
    d4.textContent = "OCEANS MASKED OUT PER TAYLOR 2026-10-24";
    d5.textContent = "TAP LAND FOR A NODE";
  } else {
    d3.textContent = "SEL \u2014 TAP A NODE";
    d4.textContent = "TAP AN EDGE FOR THE LATTICE RULE";
    d5.textContent = "TAP BLACK FOR THE OCEAN NOTE";
  }
  document.getElementById("s1").textContent = "SLATE: OCEANS REMOVED PER TAYLOR 2026-10-24.";
  document.getElementById("s2").textContent = "BASE: NASA BMNG MAY 2004, 8 TILES, 780\u00d7390.";
  document.getElementById("s3").textContent = "GREEN = PROXY FOR THE CARBON LAYER, NOT CARBON.";
  document.getElementById("s4").textContent = "NODES = LAND VERTICES ONLY. NO TONNAGE CLAIMED.";
  document.getElementById("s5").textContent = "LATTICE = FORMULA FRAMEWORK, NOT A DISCOVERY.";
  document.getElementById("bZoom").classList.toggle("on", !!region);
}
// Ocean test: sample the embedded masked image (ocean pixels are black).
const probe = document.createElement("canvas");
function oceanAtStage(x, y){
  try {
    const pctx = probe.getContext("2d", {willReadFrequently: true});
    probe.width = 390; probe.height = 650;
    pctx.drawImage(img, MAP.x0, MAP.y0, MAP.w, MAP.h);
    const d = pctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
    return d[0] < 8 && d[1] < 8 && d[2] < 8;
  } catch (e){ return false; }
}
function distPtSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
document.getElementById("cv").addEventListener("click", ev => {

  const y = (ev.clientY - r.top) * 650 / r.height;
  if (!inMap(x, y)){ sel = null; edgeSel = null; window.__oceanMsg = false; draw(); return; }
  let best = null, bd = 10;
  MODEL.nodes.forEach(n => {
    const p = project(n.lon, n.lat);
    if (!inMap(p.x, p.y)) return;
    const d = Math.hypot(x - p.x, y - p.y);
    if (d < bd){ bd = d; best = n.id; }
  });
  if (best){ sel = best; edgeSel = null; window.__oceanMsg = false; draw(); return; }
  let be = null, bed = 7;
  MODEL.edges.forEach(e => {
    const a = parseId(e[0]), b = parseId(e[1]);
    const pa = project(a.lon, a.lat), pb = project(b.lon, b.lat);
    const d = distPtSeg(x, y, pa.x, pa.y, pb.x, pb.y);
    if (d < bed){ bed = d; be = e[0] + "|" + e[1]; }
  });
  if (be){ edgeSel = be; sel = null; window.__oceanMsg = false; draw(); return; }
  if (!region && oceanAtStage(x, y)){
    sel = null; edgeSel = null; window.__oceanMsg = true; draw(); return;
  }
  sel = null; edgeSel = null; window.__oceanMsg = false; draw();
});
document.getElementById("bFull").addEventListener("click", () => { region = null; draw(); });
document.getElementById("bZoom").addEventListener("click", () => {
  if (region){ region = null; }
  else if (sel){ region = sel; }
  else {
    let mx = MODEL.nodes[0];
    MODEL.nodes.forEach(n => { if (n.proxy > mx.proxy) mx = n; });
    region = mx.id;
  }
  draw();
});
document.getElementById("bReset").addEventListener("click", () => {
  sel = null; edgeSel = null; region = null; window.__oceanMsg = false; draw();
});
window.LATTICE = {model: MODEL, project: project,
  view: () => ({sel: sel, edgeSel: edgeSel, region: region})};
img.onload = draw;
if (img.complete) draw();
</script></body></html>
