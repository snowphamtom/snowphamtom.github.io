  .card{display:block;text-align:center;width:min(92vw,430px);padding:12px 0 6px;}
  .emblem{width:120px;height:120px;margin:0 auto;border-radius:28px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(232,179,75,.35), 0 18px 44px rgba(0,0,0,.55), 0 0 34px rgba(23,84,166,.35);
    transition:box-shadow .8s ease;}
  body.open .emblem{box-shadow:0 0 0 1px rgba(232,179,75,.9), 0 18px 44px rgba(0,0,0,.55), 0 0 58px rgba(232,179,75,.45);}
  .emblem img{width:120%;height:120%;margin:-10% 0 0 -10%;display:block;}
  .title{margin-top:26px;font-size:13px;letter-spacing:.42em;color:#e8b34b;text-shadow:0 2px 14px rgba(0,0,0,.85);text-indent:.42em;}
  .pid{margin-top:8px;font-size:10px;letter-spacing:.3em;color:#5d82ab;text-indent:.3em;}
  .mouth{width:min(64vw,270px);margin:26px auto 0;filter:drop-shadow(0 16px 30px rgba(0,0,0,.6));}
  #seam{stroke:#33507a;transition:stroke .8s ease;}
  body.open #seam{stroke:#e8b34b;filter:drop-shadow(0 0 6px rgba(232,179,75,.95));}
  form{margin:30px auto 0;width:min(84vw,340px);}
  input{width:100%;background:rgba(1,4,10,.72);border:1px solid #33507a;border-radius:10px;
    color:#cfe8ff;font-size:15px;padding:13px 14px;text-align:center;letter-spacing:.06em;outline:none;}
  input:focus{border-color:#e8b34b;}
  button{margin-top:12px;width:100%;background:transparent;border:1px solid rgba(232,179,75,.55);border-radius:10px;
    color:#e8b34b;font-size:12px;letter-spacing:.34em;text-indent:.34em;padding:12px 0;cursor:pointer;}
  button:active{transform:translateY(1px);}
  .voice{margin-top:30px;font-size:15px;color:#a9cdf2;letter-spacing:.14em;text-shadow:0 2px 14px rgba(0,0,0,.8);min-height:1.4em;}
  nav.doors{margin-top:8px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  nav.doors a{display:block;width:min(84vw,340px);padding:13px 0;text-decoration:none;text-align:center;
    border:1px solid rgba(232,179,75,.55);border-radius:10px;color:#e8b34b;background:rgba(1,4,10,.6);
    font-size:12px;letter-spacing:.34em;text-indent:.34em;}
  nav.doors a:active{transform:translateY(1px);}
  [hidden]{display:none !important;}
  .legal{margin:26px auto 0;max-width:38ch;font-size:9.5px;line-height:1.8;letter-spacing:.18em;color:#5d82ab;text-shadow:0 1px 10px rgba(0,0,0,.85);}
</style>

    var frag = location.hash.slice(1);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    attempt(frag);
  }
})();
