const LIGHT = {x:0.62, y:0.30, i:1.00, fall:4.5, color:"#fff3d6"};
const SHADE = {floor:0.42, steps:16};
const REFL = {att:0.30};
const CYCLE = 4000;
let SW=390, SH=650;
let T = 2000, playing=false, sel=null;
const qs = new URLSearchParams(location.search);
if(qs.has("t")){ T = Math.max(0, Math.min(CYCLE, parseFloat(qs.get("t")))); }
if(qs.has("sel")){
  const s = qs.get("sel");
  if(s[0]==="b") sel = {type:"bundle", i:parseInt(s.slice(1))};
  else if(s==="c") sel = {type:"coolant"};
  else if(s==="p") sel = {type:"processor"};
  else if(s==="g") sel = {type:"gate"};
  else if(s==="s") sel = {type:"substrate"};
  else if(s[0]==="t"){ const p = s.slice(1).split("_"); sel = {type:"thread", k:parseInt(p[0])}; }
}
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stageEl = document.getElementById("stage");
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function shadeAt(hex, I){
  const c = hexRGB(hex), L = hexRGB(LIGHT.color), q = 1/SHADE.steps;
  const Iq = Math.round(I/q)*q;
  const f = SHADE.floor + (1-SHADE.floor)*Iq;
  const out = c.map((v,i)=>Math.round(v*f + L[i]*(1-f)*Math.max(0, Iq-0.75)*0.35));
  return "rgb("+out.join(",")+")";
}
function illum(px,py){ const d = Math.hypot(px-LIGHT.x*SW, py-LIGHT.y*SH)/SH; return LIGHT.i/(1+LIGHT.fall*d*d); }
function shadeCol(hex, px, py){ return shadeAt(hex, illum(px,py)); }
function X(f){ return f*SW; }
function Y(f){ return f*SH; }
function cubicPt(c, s){
  const u=1-s;
  return [u*u*u*c[0][0]+3*u*u*s*c[1][0]+3*u*s*s*c[2][0]+s*s*s*c[3][0],
          u*u*u*c[0][1]+3*u*u*s*c[1][1]+3*u*s*s*c[2][1]+s*s*s*c[3][1]];
}
function threadPts(t){
  const pts=[];
  for(let i=0;i<=32;i++){ const p = cubicPt(t.pts, i/32); pts.push([X(p[0]), Y(p[1])]); }
  return pts;
}
function ellipsePt(rx, ry, s){
  const a = s*2*Math.PI;
  return [X(MODEL.centre[0]+rx*Math.cos(a)), Y(MODEL.centre[1]+ry*Math.sin(a))];
}
function drawSphere(x,y,r,hex){
  ctx.fillStyle = "#1a1a1a"; ctx.beginPath();
  const dx0 = x-LIGHT.x*SW, dy0 = y-LIGHT.y*SH, m0 = Math.hypot(dx0,dy0)||1;
  ctx.arc(x+dx0/m0*r*1.9, y+dy0/m0*r*1.9, r*0.5, 0, 7); ctx.fill();
  const I = illum(x,y);
  ctx.fillStyle = shadeAt(hex, 0.55*I); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  const dx = LIGHT.x*SW-x, dy = LIGHT.y*SH-y, m = Math.hypot(dx,dy)||1;
  ctx.fillStyle = shadeAt(hex, I); ctx.beginPath();
  ctx.arc(x+dx/m*r*0.38, y+dy/m*r*0.38, r*0.62, 0, 7); ctx.fill();
  ctx.fillStyle = shadeAt(hex, illum(x, y+r*2.2)*REFL.att+0.15); ctx.globalAlpha = REFL.att;
  ctx.beginPath(); ctx.arc(x, y+r*2.2, r*0.8, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}
function draw(){
  ctx.fillStyle="#000000"; ctx.fillRect(0,0,SW,SH);
  const cx = X(MODEL.centre[0]), cy = Y(MODEL.centre[1]);
  ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(MODEL.hero.x0), Y(MODEL.subY)); ctx.lineTo(X(MODEL.hero.x1), Y(MODEL.subY)); ctx.stroke();
  for(const t of MODEL.threads){
    const pts = threadPts(t), hue = MODEL.bundles[t.bundle].hue;
    const isSel = (sel && sel.type==="thread" && sel.k===t.k) ||
                  (sel && sel.type==="bundle" && sel.i===t.bundle);
    ctx.strokeStyle = shadeCol(hue, pts[16][0], pts[16][1]);
    ctx.globalAlpha = isSel ? 1.0 : 0.60;
    ctx.lineWidth = isSel ? 2.2 : 1.1;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = MODEL.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.ellipse(cx, cy, MODEL.gate.rx*SW, MODEL.gate.ry*SH, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = shadeCol("#57c8ff", X(MODEL.centre[0]+MODEL.loop.rx), cy);
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(cx, cy, MODEL.loop.rx*SW, MODEL.loop.ry*SH, 0, 0, 7); ctx.stroke();
  for(let k=0;k<8;k++){
    const p = ellipsePt(MODEL.loop.rx, MODEL.loop.ry, T/CYCLE + k/8);
    drawSphere(p[0], p[1], 4.5, "#57c8ff");
  }
  ctx.strokeStyle = MODEL.gold; ctx.lineWidth = 2;
  ctx.strokeRect(X(MODEL.centre[0]-MODEL.core.hw), Y(MODEL.centre[1]-MODEL.core.hh),
                 MODEL.core.hw*2*SW, MODEL.core.hh*2*SH);
  drawSphere(cx, cy, 8, MODEL.gold);
  for(const h of MODEL.hubs){
    const isSel = sel && sel.type==="bundle" && sel.i===h.i;
    drawSphere(X(h.x), Y(h.y), isSel ? 9 : 7, h.hue);
  }
  for(const l of MODEL.leaves){
    const hue = MODEL.bundles[l.bundle].hue;
    ctx.fillStyle = shadeCol(hue, X(l.x), Y(l.y)); ctx.beginPath(); ctx.arc(X(l.x), Y(l.y), 2.5, 0, 7); ctx.fill();
  }
  drawDash();
}
function bundleText(i){
  const b = MODEL.bundles[i];
  return "BUNDLE B"+i+" · "+b.role+"<br>HUE "+b.hue+" · DRAWN "+(1+b.fans)+"<br>CARRIES "+b.role+"<br>GRADE FRAMING<br>COUNTS NOT CLAIMED";
}
function drawDash(){
  document.getElementById("flowState").innerHTML =
    "LOOP CLOCKWISE<br>T "+T.toFixed(0)+" / 4000 · BEADS 8<br>FLOW, NOT DATA<br>RIVERS + CURRENTS";
  document.getElementById("tRead").textContent = "T "+T.toFixed(0)+" MS";
  const el = document.getElementById("insp");
  if(!sel){ el.textContent = "TAP A THREAD, A BUNDLE, THE LOOP, OR A NODE."; }
  else if(sel.type==="bundle"){ el.innerHTML = bundleText(sel.i); }
  else if(sel.type==="thread"){ const t = MODEL.threads[sel.k];
    el.innerHTML = "THREAD "+t.k+" · BUNDLE B"+t.bundle+"<br>"+t.kind.toUpperCase()+" · "+MODEL.bundles[t.bundle].role+"<br>"+t.from+" → "+t.to+"<br>ONE THREAD, ONE PATH<br>GRADE FRAMING"; }
  else if(sel.type==="coolant"){ el.innerHTML = "COOLANT LOOP · OCEANS<br>SALTWATER LOOP<br>COOLS BY CIRCULATION<br>FLOW CLOCKWISE<br>GRADE FRAMING"; }
  else if(sel.type==="processor"){ el.innerHTML = "PROCESSOR<br>CORE + MANTLE<br>WORK, IN THE FRAMING<br>GRADE FRAMING"; }
  else if(sel.type==="gate"){ el.innerHTML = "GATE · EXCHANGE<br>ADMITS ONLY WHAT FITS<br>ANALOGY: BRAIN GATE<br>GRADE FRAMING"; }
  else if(sel.type==="substrate"){ el.innerHTML = "SUBSTRATE<br>CRUST + SOIL<br>GROUND, IN THE FRAMING<br>GRADE FRAMING"; }
  const gd = document.getElementById("groups");
  gd.innerHTML = MODEL.bundles.map(b=>{
    return "<span class='tag' data-b='"+b.i+"'>B"+b.i+" "+b.role+"</span>";
  }).join(" · ");
  gd.querySelectorAll(".tag").forEach(tag=>tag.onclick=()=>{ sel={type:"bundle", i:parseInt(tag.dataset.b)}; draw(); });
  document.getElementById("scrub").value = T;
}
function buildLabels(){
  const L = document.getElementById("labels"); L.innerHTML = "";
  const mk = (fx, fy, html, cls)=>{
    const d = document.createElement("div"); d.className = "ov"+(cls?" "+cls:"");
    d.style.left = (fx*100)+"%"; d.style.top = (fy*100)+"%"; d.innerHTML = html; L.appendChild(d); return d; };
  mk(0.50, 0.075, "EARTH — SALTWATER-COOLED CPU");
  const pr = mk(0.32, 0.32, "PROCESSOR", "tag"); pr.onclick = ()=>{ sel={type:"processor"}; draw(); };
  const ga = mk(0.70, 0.24, "GATE", "tag"); ga.onclick = ()=>{ sel={type:"gate"}; draw(); };
  const co = mk(0.50, 0.485, "COOLANT LOOP", "tag"); co.onclick = ()=>{ sel={type:"coolant"}; draw(); };
  const su = mk(0.82, 0.545, "SUBSTRATE", "tag"); su.onclick = ()=>{ sel={type:"substrate"}; draw(); };
}
function sizeStage(){
  SW = stageEl.clientWidth; SH = Math.round(SW*5/3);
  stageEl.style.height = SH+"px"; cv.width = SW; cv.height = SH;
  const f = (r)=>Math.max(13, Math.round(r*SH));
  document.getElementById("hudT").style.fontSize = f(0.020)+"px";
  document.getElementById("hudS").style.fontSize = f(0.020)+"px";
  document.querySelectorAll(".ov").forEach(el=>el.style.fontSize = f(0.020)+"px");
  document.querySelectorAll(".pan").forEach(el=>el.style.fontSize = f(0.020)+"px");
  document.querySelectorAll(".pan h3").forEach(el=>el.style.fontSize = f(0.022)+"px");
  document.getElementById("transport").style.fontSize = f(0.020)+"px";
  document.querySelectorAll("#transport button").forEach(el=>el.style.fontSize = f(0.020)+"px");
}
function distToEllipse(x, y, rx, ry){
  let best = 1e9;
  for(let i=0;i<72;i++){ const p = ellipsePt(rx, ry, i/72); const d = Math.hypot(p[0]-x, p[1]-y); if(d<best) best=d; }
  return best;
}
cv.addEventListener("click", (e)=>{
  const r = cv.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top;
  for(const h of MODEL.hubs){
    if(Math.hypot(X(h.x)-x, Y(h.y)-y)<=16){ sel={type:"bundle", i:h.i}; draw(); return; } }
  if(Math.abs(y-Y(MODEL.subY))<=6 && x>=X(MODEL.hero.x0) && x<=X(MODEL.hero.x1)){ sel={type:"substrate"}; draw(); return; }
  if(distToEllipse(x, y, MODEL.gate.rx, MODEL.gate.ry)<=8){ sel={type:"gate"}; draw(); return; }
  if(distToEllipse(x, y, MODEL.loop.rx, MODEL.loop.ry)<=8){ sel={type:"coolant"}; draw(); return; }
  const cx = X(MODEL.centre[0]), cy = Y(MODEL.centre[1]);
  if(Math.abs(x-cx)<=MODEL.core.hw*SW && Math.abs(y-cy)<=MODEL.core.hh*SH){ sel={type:"processor"}; draw(); return; }
  let best = null, bd = 1e9;
  for(const t of MODEL.threads){ const pts = threadPts(t);
    for(const p of pts){ const d = Math.hypot(p[0]-x, p[1]-y); if(d<bd){ bd=d; best=t; } } }
  if(best && bd<=10){ sel={type:"thread", k:best.k}; draw(); return; }
});
document.getElementById("bPlay").onclick = ()=>{
  if(playing){ playing=false; document.getElementById("bPlay").textContent="PLAY"; return; }
  playing=true; document.getElementById("bPlay").textContent="PAUSE";
  const start = performance.now()-T;
  const step = (now)=>{ if(!playing) return; T = (now-start)%CYCLE; draw(); requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
document.getElementById("bSettled").onclick = ()=>{ playing=false; document.getElementById("bPlay").textContent="PLAY"; T=2000; draw(); };
document.getElementById("bStep").onclick = ()=>{ playing=false; document.getElementById("bPlay").textContent="PLAY"; T=Math.min(CYCLE, T+250); draw(); };
document.getElementById("scrub").oninput = (e)=>{ playing=false; document.getElementById("bPlay").textContent="PLAY"; T=parseFloat(e.target.value); draw(); };
document.getElementById("bReset").onclick = ()=>{ sel=null; T=2000; draw(); };
window.__EARTH__ = { model: MODEL,
  stage: ()=>({SW: SW, SH: SH}),
  setT: (t)=>{ T=t; draw(); }, getT: ()=>T, getSel: ()=>sel,
  hubXY: (i)=>{ const h = MODEL.hubs[i]; return [X(h.x), Y(h.y)]; },
  loopPoint: (s)=>ellipsePt(MODEL.loop.rx, MODEL.loop.ry, s),
  gatePoint: (s)=>ellipsePt(MODEL.gate.rx, MODEL.gate.ry, s),
  coreXY: ()=>{ return [X(MODEL.centre[0]), Y(MODEL.centre[1])]; },
  subPoint: ()=>{ return [X(0.50), Y(MODEL.subY)]; },
  threadPoint: (k, s)=>{ const pts = threadPts(MODEL.threads[k]); return pts[Math.min(pts.length-1, s)]; } };
sizeStage(); buildLabels(); draw();
window.addEventListener("resize", ()=>{ sizeStage(); buildLabels(); draw(); });
